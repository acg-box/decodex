# Diagnostic binaries import application modules. Run those shared tests in the app
# binary only, while retaining the visual capture binary's own send-result tests.
[profile.default]
default-filter = 'not (binary_id(decodex-gpui::bin/decodex-native-glass-probe) or (binary_id(decodex-gpui::bin/decodex-gpui-workbench-visual-capture) and not test(capture_send_tests::)))'

# App-server process tests exercise shared host process limits and timing-sensitive
# cleanup. Serialize this group so validation results do not depend on host load.
[test-groups]
app-server-process = { max-threads = 1 }
native-media       = { max-threads = 1 }

[[profile.default.overrides]]
filter     = 'test(account_launch::process::tests::)'
test-group = 'app-server-process'

# These tests start full daemon processes and wait for exact transport cleanup.
# Keep them in the process group and reserve every global test thread so unrelated
# heavy tests cannot consume their bounded startup window.
[[profile.default.overrides]]
filter           = 'binary_id(decodex-cli::signal_shutdown)'
test-group       = 'app-server-process'
threads-required = 'num-test-threads'

# Native ICE and audio playout use wall-clock deadlines. Give each media
# exchange the runner while it checks real packet flow and mute transitions.
[[profile.default.overrides]]
filter           = 'test(voice::transport::tests::native_call_exchanges) or test(voice::transport::tests::remote_channel_loss)'
test-group       = 'native-media'
threads-required = 'num-test-threads'

# This full-frame check samples the middle of a 200 ms disclosure transition.
# Reserve the runner so concurrent rendering cannot skip that wall-clock window.
[[profile.default.overrides]]
filter           = 'test(exchange_disclosure_animates_in_both_directions_without_changing_the_draft)'
threads-required = 'num-test-threads'
