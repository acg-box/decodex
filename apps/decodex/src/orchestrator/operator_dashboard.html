<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Delivery progress console for Decodex retained lanes."
		/>
		<title>Decodex</title>
		<link rel="icon" type="image/png" href="/assets/icon.png" />
		<link rel="icon" href="/assets/logo.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo-touch.png" />
		<style>
			:root {
				color-scheme: light;
				--bg: #edf0ef;
				--bg-wash-primary: rgba(255, 255, 255, 0.74);
				--bg-wash-secondary: rgba(182, 199, 203, 0.42);
				--surface: rgba(247, 249, 248, 0.94);
				--surface-strong: #fbfcfb;
				--surface-muted: rgba(255, 255, 255, 0.54);
				--hover: rgba(255, 255, 255, 0.42);
				--line: rgba(28, 35, 42, 0.11);
				--line-strong: rgba(28, 35, 42, 0.18);
				--text: #1e262d;
				--muted: #6d7882;
				--muted-strong: #4f5963;
				--success: #1d8968;
				--warning: #a8681c;
				--danger: #c05c5c;
				--info: #4a73ca;
				--tone-queue: #4569d4;
				--tone-ready: #1d8968;
				--tone-run: #1489a8;
				--tone-review: #8a5bc2;
				--tone-land: #1d8968;
				--tone-wait: #a8681c;
				--tone-blocked: #c05c5c;
				--tone-repair: #b34f87;
				--tone-retained: #7b66c4;
				--tone-recovery: #6d7882;
				--tone-muted: #7a838c;
				--radius: 18px;
				--radius-sm: 12px;
				--shadow: 0 18px 48px rgba(34, 46, 50, 0.08);
				--ease: cubic-bezier(0.2, 0.8, 0.2, 1);
				--fast: 140ms;
				--medium: 220ms;
				--slow: 380ms;
				--type-micro: 10px;
				--type-caption: 11px;
				--type-label: 12px;
				--type-meta: 12px;
				--type-body: 13px;
				--type-row-title: 13px;
				--type-row-aside: 11px;
				--type-section-title: 13px;
				--type-display: 18px;
				--weight-label: 500;
				--weight-strong: 600;
				--tracking-caps: 0;
				--space-2xs: 4px;
				--space-xs: 6px;
				--space-sm: 8px;
				--space-account-row-y: 8px;
				--space-md: 12px;
				--space-row-y: 12px;
				--space-panel-head-y: 12px;
				--space-row-indent: 18px;
				--space-section-x: 20px;
				--space-section-y: 16px;
				--space-card-y: 16px;
				--mono:
					"Menlo", "Monaco", "SFMono-Regular", "SF Mono", ui-monospace, "Cascadia Mono",
					"Roboto Mono", "Consolas", monospace;
				--sans:
					-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", sans-serif;
			}

			:root[data-theme="dark"] {
				color-scheme: dark;
				--bg: #111413;
				--bg-wash-primary: rgba(68, 90, 86, 0.36);
				--bg-wash-secondary: rgba(82, 64, 40, 0.16);
				--surface: rgba(20, 25, 24, 0.92);
				--surface-strong: #171d1c;
				--surface-muted: rgba(28, 35, 33, 0.62);
				--hover: rgba(255, 255, 255, 0.04);
				--line: rgba(231, 238, 245, 0.1);
				--line-strong: rgba(231, 238, 245, 0.16);
				--text: #edf2f7;
				--muted: #95a1ad;
				--muted-strong: #bdc7d1;
				--success: #5cc59f;
				--warning: #e0a95a;
				--danger: #ef8a8a;
				--info: #83a8ff;
				--tone-queue: #92a8ff;
				--tone-ready: #5cc59f;
				--tone-run: #67d9ef;
				--tone-review: #c59aff;
				--tone-land: #5cc59f;
				--tone-wait: #e0a95a;
				--tone-blocked: #ef8a8a;
				--tone-repair: #f09bc6;
				--tone-retained: #b9a8ff;
				--tone-recovery: #aab4bf;
				--tone-muted: #95a1ad;
				--shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
			}

			html {
				background: var(--bg);
			}

			body {
				background:
					radial-gradient(circle at top left, var(--bg-wash-primary), transparent 30%),
					radial-gradient(circle at 84% 0%, var(--bg-wash-secondary), transparent 38%),
					linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 32%),
					var(--bg);
				background-attachment: fixed, fixed, fixed, scroll;
				background-size: 100vw 100vh, 100vw 100vh, 100vw 100vh, auto;
				color: var(--text);
				font-family: var(--sans);
				transition:
					background-color var(--medium) var(--ease),
					color var(--medium) var(--ease);
			}

			body {
				padding: 18px;
			}

			a {
				color: inherit;
			}

			button {
				font: inherit;
				cursor: pointer;
			}

			.shell {
				max-width: 1180px;
				margin: 0 auto;
				display: grid;
				gap: var(--space-panel-head-y);
			}

			.masthead {
				display: grid;
				gap: 8px;
				padding: 10px 20px 9px;
				border-top: 0;
				border-bottom: 0;
				background: var(--surface-muted);
				box-shadow: none;
				backdrop-filter: blur(18px);
				position: sticky;
				top: 0;
				z-index: 10;
				transition:
					background-color var(--medium) var(--ease),
					border-color var(--medium) var(--ease),
					box-shadow var(--medium) var(--ease);
			}

			.topbar {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 12px 20px;
				align-items: center;
				padding: 0;
			}

			.topbar-main {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 8px 14px;
			}

			.topbar-heading {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 10px;
			}

			h1 {
				margin: 0;
				font-size: var(--type-display);
				letter-spacing: 0;
				line-height: 1;
			}

			.panel-head p,
			.table-meta,
			.empty-copy {
				margin: 0;
				color: var(--muted-strong);
				line-height: 1.5;
			}

			.table-meta {
				font-family: var(--mono);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				line-height: 1.35;
				color: var(--muted);
			}

			.table-meta:empty {
				display: none;
			}

			.table-meta[data-tone="attention"] {
				color: color-mix(in srgb, var(--warning) 82%, var(--text));
			}

			.table-meta[data-tone="active"] {
				color: var(--muted);
			}

			.metric-text {
				display: inline-flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 0 6px;
				min-width: 0;
				font-family: var(--mono);
				font-variant-numeric: tabular-nums;
			}

			.metric-group {
				display: inline-flex;
				align-items: baseline;
				gap: 4px;
				min-width: 0;
				white-space: nowrap;
			}

			.metric-number {
				color: var(--muted-strong);
				font-family: var(--mono);
				font-size: 0.92em;
				font-weight: var(--weight-label);
				font-variant-numeric: tabular-nums;
				letter-spacing: 0;
				line-height: 1;
			}

			.metric-label {
				color: var(--muted);
				font-family: var(--mono);
				font-weight: var(--weight-label);
				letter-spacing: 0;
			}

			.metric-separator {
				color: var(--muted);
				opacity: 0.62;
			}

			.table-meta .metric-number {
				color: var(--muted-strong);
			}

			.table-meta[data-tone="attention"] .metric-number,
			.table-meta[data-tone="attention"] .metric-label {
				color: color-mix(in srgb, var(--warning) 82%, var(--text));
			}

			.table-meta[data-tone="active"] .metric-number {
				color: var(--muted-strong);
			}

			.topbar-side {
				display: flex;
				gap: 18px;
				justify-content: end;
				align-items: center;
				min-width: 0;
			}

			.toolbar-controls,
			.transport-row {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				align-items: center;
			}

			.toolbar-controls {
				justify-content: end;
			}

			.notice-dock {
				position: fixed;
				right: 18px;
				bottom: 18px;
				z-index: 60;
				width: min(380px, calc(100vw - 36px));
				display: none;
			}

			.notice-dock.visible {
				display: block;
			}

			.notice-trigger {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				width: 100%;
				min-height: 40px;
				padding: 8px 12px;
				border: 1px solid var(--line-strong);
				border-left: 2px solid currentColor;
				background: var(--surface-strong);
				backdrop-filter: blur(18px);
				list-style: none;
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				color: var(--danger);
				cursor: pointer;
				box-shadow: var(--shadow);
			}

			.notice-trigger::-webkit-details-marker {
				display: none;
			}

			.notice-trigger::after {
				content: "";
				flex: 0 0 auto;
				width: 6px;
				height: 6px;
				border-right: 1.5px solid currentColor;
				border-bottom: 1.5px solid currentColor;
				transform: translateY(-2px) rotate(45deg);
				transition: transform var(--fast) var(--ease);
			}

			.notice-dock[open] .notice-trigger::after {
				transform: translateY(1px) rotate(225deg);
			}

			.notice-dock[data-tone="warning"] .notice-trigger {
				color: var(--warning);
			}

			.notice-main {
				display: flex;
				align-items: baseline;
				gap: 8px;
				min-width: 0;
			}

			.notice-kicker {
				color: var(--muted);
			}

			.notice-hint {
				color: var(--muted);
				font-size: var(--type-caption);
				letter-spacing: var(--tracking-caps);
			}

			.notice-panel {
				position: absolute;
				top: auto;
				right: 0;
				bottom: calc(100% + 8px);
				z-index: 30;
				width: 100%;
				max-height: min(360px, 48vh);
				padding: 12px 14px;
				border: 1px solid var(--line-strong);
				border-left: 2px solid var(--danger);
				background: var(--surface-strong);
				box-shadow: var(--shadow);
				overflow: auto;
				animation: reveal-panel var(--medium) var(--ease);
			}

			.notice-dock[data-tone="warning"] .notice-panel {
				border-left-color: var(--warning);
			}

			.notice-item + .notice-item {
				margin-top: 10px;
				padding-top: 10px;
				border-top: 1px solid var(--line);
			}

			.notice-item strong {
				display: block;
				margin-bottom: 3px;
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-strong);
				letter-spacing: var(--tracking-caps);
				color: var(--text);
			}

			.notice-item p {
				margin: 0;
				color: var(--muted-strong);
				font-size: var(--type-body);
				line-height: 1.38;
			}

			.notice-item .control-button {
				margin-top: 8px;
			}

			.notice-item.danger strong {
				color: var(--danger);
			}

			.notice-item.warning strong {
				color: var(--warning);
			}

			.theme-switch {
				display: inline-flex;
				align-items: center;
				gap: 16px;
			}

			.theme-option,
			.status-pill {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
			}

			.theme-option {
				position: relative;
				padding: 7px 0;
				border: 0;
				background: transparent;
				color: var(--muted-strong);
				transition:
					color var(--fast) var(--ease),
					transform var(--fast) var(--ease);
			}

			.theme-option::after {
				content: "";
				position: absolute;
				left: 0;
				right: 0;
				bottom: 2px;
				height: 2px;
				background: currentColor;
				opacity: 0;
				transform: scaleX(0.4);
				transform-origin: left center;
				transition:
					opacity var(--fast) var(--ease),
					transform var(--fast) var(--ease);
			}

			.theme-option.active {
				color: var(--text);
			}

			.theme-option.active::after,
			.theme-option:hover::after {
				opacity: 1;
				transform: scaleX(1);
			}

			.theme-option:hover {
				transform: translateY(-1px);
			}

			.theme-option,
			.status-pill {
				transition:
					color var(--fast) var(--ease),
					border-color var(--fast) var(--ease),
					background-color var(--fast) var(--ease),
					opacity var(--fast) var(--ease),
					transform var(--fast) var(--ease);
			}

			.theme-option:hover {
				color: var(--text);
			}

			.theme-option:active {
				transform: translateY(0);
				opacity: 0.72;
			}

			.theme-option:focus-visible,
			summary:focus-visible {
				outline: 1px solid var(--line-strong);
				outline-offset: 4px;
			}

			.status-pill {
				padding: 0;
				border: 0;
				background: transparent;
				color: var(--muted-strong);
				line-height: 1;
			}

			.status-pill::before {
				content: "";
				width: 2px;
				height: 14px;
				margin-right: 8px;
				background: currentColor;
				transition: transform var(--fast) var(--ease);
			}

			.transport-meta {
				display: inline-flex;
				align-items: center;
				min-width: 0;
				gap: 6px;
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				line-height: 1;
				color: var(--muted);
				white-space: nowrap;
			}

			.transport-meta::before {
				content: "";
				width: 1px;
				height: 14px;
				background: var(--line-strong);
			}

			.transport-meta strong {
				overflow: hidden;
				max-width: min(42vw, 320px);
				color: var(--muted-strong);
				font-weight: var(--weight-label);
				text-transform: none;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.transport-meta[data-kind="endpoint"] strong {
				font-family: var(--mono);
				font-variant-ligatures: none;
				letter-spacing: 0;
			}

			.value-link,
			.transport-link {
				color: inherit;
				margin: -1px -3px;
				padding: 1px 3px;
				border-radius: 4px;
				text-decoration: none;
				transition:
					color var(--fast) var(--ease),
					background-color var(--fast) var(--ease),
					box-shadow var(--fast) var(--ease),
					transform var(--fast) var(--ease);
			}

			.value-link:hover,
			.transport-link:hover {
				color: var(--text);
				background: color-mix(in srgb, currentColor 10%, transparent);
				box-shadow: 0 0 0 1px color-mix(in srgb, currentColor 18%, transparent);
			}

			.value-link:active,
			.transport-link:active {
				transform: translateY(1px);
			}

			.value-link:focus-visible,
			.transport-link:focus-visible {
				outline: 1px solid color-mix(in srgb, currentColor 42%, transparent);
				outline-offset: 2px;
			}

			.transport-meta[data-tone="success"] strong {
				color: var(--success);
			}

			.transport-meta[data-tone="warning"] strong {
				color: var(--warning);
			}

			.transport-meta[data-tone="danger"] strong {
				color: var(--danger);
			}

			.flow-strip {
				position: relative;
				padding: 9px 0 0;
			}

			.flow-strip::before {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 1px;
				background: linear-gradient(90deg, transparent, var(--line), transparent);
				pointer-events: none;
			}

			.flow-step span {
				font-family: var(--mono);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				color: var(--muted-strong);
			}

			.flow-step-labels {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				align-items: baseline;
				gap: 0;
				min-width: 0;
			}

			.flow-step {
				display: grid;
				grid-template-columns: auto minmax(0, 1fr);
				align-items: baseline;
				gap: 10px;
				min-width: 0;
				padding: 0 18px;
				transition:
					color var(--fast) var(--ease);
			}

			.flow-step:first-child {
				padding-left: 0;
			}

			.flow-step + .flow-step {
				border-left: 1px solid var(--line);
			}

			.flow-step strong {
				color: var(--text);
				font-family: var(--mono);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				font-variant-numeric: tabular-nums;
				letter-spacing: 0;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				text-align: right;
				white-space: nowrap;
			}

			.flow-step.active span {
				color: var(--accent);
			}

			.flow-step.active strong {
				color: var(--accent);
			}

			.flow-step strong .metric-number {
				color: var(--text);
			}

			.flow-step strong .metric-label {
				color: var(--muted);
			}

			.flow-step.active strong .metric-number,
			.flow-step.active strong .metric-label {
				color: var(--accent);
			}

			.flow-step[data-flow-step="queue"] {
				--accent: var(--tone-queue);
			}

			.flow-step[data-flow-step="run"] {
				--accent: var(--tone-run);
			}

			.flow-step[data-flow-step="review"] {
				--accent: var(--tone-review);
			}

			.flow-step[data-flow-step="land"] {
				--accent: var(--tone-land);
			}

			.workspace {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				gap: 0;
				align-items: start;
				padding: 0 0 76px;
				background: transparent;
			}

			.workspace[hidden],
			.stack[hidden],
			.section-marker[hidden],
			.panel[hidden] {
				display: none !important;
			}

			.stack {
				display: grid;
				gap: 0;
			}

			.section-marker {
				--section-tone: var(--tone-muted);
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				gap: var(--space-sm) var(--space-row-indent);
				margin: var(--space-section-y) var(--space-section-x) 0;
				padding: var(--space-sm) 0 var(--space-xs);
				border-top: 1px solid var(--line-strong);
				font-family: var(--sans);
				color: var(--muted);
			}

			.section-marker:first-child {
				margin-top: 0;
				padding-top: var(--space-panel-head-y);
			}

			.section-marker > span {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				min-width: 0;
				color: var(--muted-strong);
				font-size: var(--type-section-title);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				line-height: 1.25;
				white-space: nowrap;
			}

			.section-marker > span::before {
				content: "";
				flex: 0 0 auto;
				width: 2px;
				height: 14px;
				background: var(--section-tone);
			}

			.section-marker-meta {
				flex: 0 1 auto;
				min-width: 0;
				max-width: min(320px, 50vw);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				text-align: right;
			}

			.section-marker-control {
				--section-tone: var(--tone-muted);
			}

			.section-marker-projects {
				--section-tone: var(--info);
			}

			.section-marker-execution {
				--section-tone: var(--tone-run);
			}

			.section-marker-aftercare {
				--section-tone: var(--tone-review);
			}

			.panel {
				display: grid;
				gap: 0;
				padding: 0 var(--space-section-x);
				border: 0;
				border-radius: 0;
				background: transparent;
				box-shadow: none;
				overflow: visible;
				transition:
					background-color var(--medium) var(--ease),
					border-color var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			#current-lanes-panel {
				background: transparent;
			}

			.panel-head {
				display: flex;
				flex-wrap: wrap;
				align-items: end;
				justify-content: space-between;
				gap: var(--space-md);
				padding: var(--space-panel-head-y) 0 var(--space-md);
				border-bottom: 0;
				transition:
					color var(--fast) var(--ease),
					transform var(--medium) var(--ease);
			}

			.panel-head > div {
				display: grid;
				gap: 4px;
			}

			.panel-head h2 {
				margin: 0;
				font-size: var(--type-section-title);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				font-family: var(--sans);
				color: var(--muted-strong);
				transition: color var(--fast) var(--ease);
			}

			.panel:hover .panel-head h2 {
				color: var(--text);
			}

			#queue-panel .panel-head {
				padding-top: var(--space-panel-head-y);
			}

			.panel-body {
				padding: 0;
				background: transparent;
				border: 0;
				border-radius: 0;
				overflow: hidden;
			}

			.card-list {
				display: block;
			}

			.action-card,
			.run-card,
			.worktree-card {
				isolation: isolate;
				position: relative;
				margin: 0;
				padding: var(--space-card-y) 0 var(--space-card-y) var(--space-row-indent);
				background: transparent;
				border: 0;
				border-bottom: 1px solid var(--line);
				border-radius: 0;
				overflow: hidden;
				transition:
					background-color var(--fast) var(--ease),
					border-color var(--fast) var(--ease);
			}

			.action-card > *,
			.run-card > *,
			.worktree-card > * {
				position: relative;
				z-index: 1;
			}

			.action-card:hover,
			.run-card:hover,
			.worktree-card:hover {
				background: linear-gradient(90deg, var(--hover), transparent 78%);
			}

			.card-list > :first-child {
				padding-top: var(--space-card-y);
			}

			.card-list > :last-child {
				border-bottom: 0;
				padding-bottom: var(--space-card-y);
			}

			.action-card::before,
			.run-card::before,
			.worktree-card::before {
				content: "";
				position: absolute;
				z-index: 2;
				left: 0;
				top: 16px;
				bottom: 16px;
				width: 3px;
				background: var(--accent, transparent);
				box-shadow: none;
				transform-origin: left center;
				transition:
					background-color var(--fast) var(--ease),
					box-shadow var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.action-card:hover::before,
			.run-card:hover::before,
			.worktree-card:hover::before {
				box-shadow: 0 0 18px color-mix(in srgb, var(--accent, transparent) 42%, transparent);
				transform: scaleX(1.45) scaleY(1.08);
			}

			.row-head {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 10px 16px;
				align-items: start;
			}

			.row-title {
				display: grid;
				gap: 5px;
				min-width: 0;
			}

			.row-title h3,
			.row-title h4,
			.run-title {
				margin: 0;
				color: var(--text);
				font-size: var(--type-row-title);
				font-weight: var(--weight-strong);
				letter-spacing: 0;
				line-height: 1.28;
			}

			.worktree-card .row-summary {
				font-size: var(--type-body);
				line-height: 1.48;
			}

			.worktree-card .field {
				gap: 3px;
			}

			.worktree-card .field-label {
				font-size: var(--type-caption);
			}

			.worktree-card .field-value {
				color: var(--muted-strong);
				font-size: var(--type-meta);
				font-weight: var(--weight-label);
			}

			.kicker {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				font-family: var(--mono);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				color: var(--muted);
			}

			.row-aside {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 8px;
				justify-content: end;
				align-items: baseline;
				color: var(--muted);
				font-family: var(--mono);
				font-size: var(--type-row-aside);
				font-weight: var(--weight-label);
				font-variant-numeric: tabular-nums;
				letter-spacing: 0;
				line-height: 1.22;
				text-align: right;
			}

			.run-title-stack {
				display: grid;
				gap: 6px;
				min-width: 0;
			}

			.run-subtitle {
				display: flex;
				flex-wrap: wrap;
				gap: 8px 12px;
				font-family: var(--mono);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				color: var(--muted);
			}

			.row-summary {
				margin: 10px 0 0;
				max-width: 78ch;
				color: var(--muted-strong);
				font-size: var(--type-body);
				line-height: 1.52;
			}

			.status-line {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				margin-top: 12px;
				font-family: var(--mono);
				font-size: var(--type-label);
				color: var(--muted);
			}

			.status-line strong {
				color: var(--text);
				font-weight: var(--weight-label);
			}

			.project-scope-list {
				display: grid;
				gap: 0;
				min-width: 0;
				overflow-x: auto;
				padding-bottom: 2px;
			}

			.project-scope-list.has-registered-projects {
				gap: 0;
			}

			.project-table {
				--project-grid:
					minmax(150px, 0.52fr) minmax(300px, 1.28fr) minmax(112px, 0.36fr)
					minmax(116px, 0.34fr);
				display: grid;
				min-width: 640px;
				background: transparent;
			}

			.project-table-guide {
				display: grid;
				grid-template-columns: var(--project-grid);
				align-items: end;
				gap: var(--space-row-y);
				min-width: 0;
				padding: 0 0 var(--space-sm) var(--space-row-indent);
				border-bottom: 1px solid color-mix(in srgb, var(--line) 58%, transparent);
				color: var(--muted);
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				line-height: 1.15;
			}

			.project-table-guide span {
				min-width: 0;
				text-align: center;
			}

			.project-table-guide .project-location-head {
				text-align: left;
			}

			.project-column-head {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 5px;
				min-width: 0;
			}

			.project-column-head.project-location-head {
				justify-content: flex-start;
			}

			.project-table-sort {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 4px;
				min-width: 0;
				max-width: 100%;
				padding: 0;
				border: 0;
				background: transparent;
				color: inherit;
				font: inherit;
				letter-spacing: inherit;
				line-height: inherit;
				text-align: center;
				cursor: pointer;
				transition: color var(--fast) var(--ease);
			}

			.project-table-sort:hover,
			.project-table-sort.is-active {
				color: var(--text);
			}

			.project-table-sort:focus-visible {
				color: var(--text);
				outline: 2px solid var(--info);
				outline-offset: 3px;
			}

			.project-table-sort-label {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.project-table-sort-icon {
				display: block;
				flex: 0 0 auto;
				width: 8px;
				height: 12px;
			}

			.project-table-sort-icon path {
				opacity: 0.38;
				transition: opacity var(--fast) var(--ease);
			}

			.project-table-sort.is-asc .project-sort-up,
			.project-table-sort.is-desc .project-sort-down {
				opacity: 1;
			}

			.project-table-list {
				display: grid;
				min-width: 0;
			}

			.project-scope-list.is-empty .empty-state {
				grid-template-columns: minmax(142px, max-content) minmax(0, 1fr);
				max-width: none;
				min-height: 34px;
				padding: var(--space-xs) 0 var(--space-sm) var(--space-row-y);
				border-left: 2px solid var(--tone-muted);
			}

			.project-scope-list.is-waiting .empty-state {
				border-left-color: var(--tone-wait);
			}

			.project-scope-list.is-empty .empty-state .empty-copy {
				max-width: 68ch;
			}

			.project-scope-list.is-empty .empty-state strong {
				color: var(--muted);
			}

			.project-empty-copy {
				display: grid;
				gap: 4px;
				min-width: 0;
			}

			.project-empty-action {
				display: block;
				width: fit-content;
				max-width: 100%;
				color: var(--muted-strong);
				font-family: var(--sans);
				font-size: var(--type-label);
				line-height: 1.35;
				overflow-wrap: anywhere;
			}

			.project-entry {
				--project-accent: var(--tone-muted);
				position: relative;
				isolation: isolate;
				display: grid;
				grid-template-areas:
					"identity location activity work";
				grid-template-columns: var(--project-grid);
				gap: 4px var(--space-row-y);
				align-items: center;
				min-width: 0;
				padding: var(--space-row-y) 0 var(--space-row-y) var(--space-row-indent);
				border-bottom: 1px solid var(--line);
				background: transparent;
				color: var(--muted-strong);
				transition: background-color var(--fast) var(--ease);
			}

			.project-table-list > .project-entry:last-child {
				border-bottom: 0;
			}

			.project-entry > * {
				position: relative;
				z-index: 1;
			}

			.project-entry::before {
				content: "";
				position: absolute;
				z-index: 2;
				left: 0;
				top: var(--space-row-y);
				bottom: var(--space-row-y);
				width: 3px;
				background: var(--project-accent);
				box-shadow: none;
				transform-origin: left center;
				transition:
					background-color var(--fast) var(--ease),
					box-shadow var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.project-entry::after {
				content: "";
				position: absolute;
				inset: 0 auto 0 0;
				z-index: 0;
				width: min(58%, 720px);
				background: linear-gradient(
					90deg,
					color-mix(in srgb, var(--project-accent) 12%, transparent),
					transparent 78%
				);
				opacity: 0;
				transform: scaleX(0.92);
				transform-origin: left center;
				transition:
					opacity var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.project-entry.is-active::before {
				box-shadow: 0 0 10px color-mix(in srgb, var(--project-accent) 22%, transparent);
			}

			.project-entry.is-active::after {
				opacity: 0.45;
				transform: scaleX(1);
			}

			.project-entry:hover {
				background: linear-gradient(90deg, var(--hover), transparent 78%);
			}

			.project-entry:hover::before {
				box-shadow: 0 0 18px color-mix(in srgb, var(--project-accent) 42%, transparent);
				transform: scaleX(1.45) scaleY(1.08);
			}

			.project-entry:hover::after {
				opacity: 0.85;
				transform: scaleX(1);
			}

			.project-entry.tone-land {
				--project-accent: var(--tone-land);
			}

			.project-entry.tone-ready {
				--project-accent: var(--tone-ready);
			}

			.project-entry.tone-wait {
				--project-accent: var(--tone-wait);
			}

			.project-entry.tone-blocked {
				--project-accent: var(--tone-blocked);
			}

			.project-entry.tone-muted {
				--project-accent: var(--tone-muted);
			}

			.project-entry-main {
				grid-area: identity;
				display: grid;
				justify-self: center;
				min-width: 0;
				text-align: center;
			}

			.project-kicker {
				color: var(--project-accent);
				font-family: var(--sans);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				letter-spacing: 0;
				line-height: 1.2;
			}

			.project-activity {
				grid-area: activity;
				justify-self: center;
				color: var(--muted);
				font-family: var(--mono);
				font-size: var(--type-label);
				letter-spacing: 0;
				line-height: 1.2;
			}

			.project-title-line {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				justify-content: center;
				gap: 8px 12px;
				min-width: 0;
			}

			.project-title-line strong {
				min-width: 0;
				color: var(--text);
				font-family: var(--mono);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				line-height: 1.26;
				overflow-wrap: anywhere;
			}

			.project-path {
				grid-area: location;
				justify-self: stretch;
				display: flex;
				align-items: baseline;
				min-width: 0;
				color: var(--muted);
				font-family: var(--mono);
				font-size: var(--type-caption);
				letter-spacing: 0;
				line-height: 1.25;
				overflow: hidden;
				text-align: left;
				white-space: nowrap;
			}

			.project-path-prefix {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.project-path-tail {
				flex: 0 0 auto;
				color: var(--muted-strong);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
			}

			.project-stat-line {
				grid-area: work;
				display: inline-flex;
				justify-self: center;
				align-items: baseline;
				justify-content: center;
				gap: 0;
				min-width: 0;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
				text-align: center;
			}

			.project-work-ratio {
				display: inline-flex;
				align-items: baseline;
				justify-content: center;
				gap: 3px;
				min-width: 0;
				font-size: var(--type-label);
				letter-spacing: 0;
				line-height: 1.2;
				white-space: nowrap;
			}

			.project-work-ratio strong {
				color: var(--muted-strong);
				font-family: var(--mono);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				line-height: 1;
			}

			.project-work-separator {
				color: var(--muted);
				opacity: 0.74;
			}

			.control-button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 26px;
				padding: 4px 9px;
				border: 1px solid var(--line-strong);
				border-radius: 999px;
				background: var(--surface-muted);
				color: var(--muted-strong);
				font-family: var(--sans);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				line-height: 1;
				transition:
					background-color var(--fast) var(--ease),
					border-color var(--fast) var(--ease),
					color var(--fast) var(--ease);
			}

			.control-button:hover {
				border-color: var(--line-strong);
				background: var(--hover);
				color: var(--text);
			}

			.control-button[data-tone="warning"] {
				color: color-mix(in srgb, var(--warning) 82%, var(--text));
			}

			.control-button[data-tone="danger"] {
				color: color-mix(in srgb, var(--danger) 82%, var(--text));
			}

			.control-button[data-tone="success"] {
				color: var(--success);
			}

			.control-button[disabled] {
				cursor: not-allowed;
				opacity: 0.5;
			}

			.timing-strip {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 1px;
				margin-top: 10px;
				border: 1px solid var(--line);
				border-radius: var(--radius-sm);
				background: var(--line);
				overflow: hidden;
			}

			.timing-cell {
				min-width: 0;
				padding: 9px 10px;
				background: var(--surface-muted);
			}

			.timing-label {
				font-family: var(--mono);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				color: var(--muted);
			}

			.timing-value {
				margin-top: 4px;
				font-family: var(--mono);
				font-size: var(--type-meta);
				color: var(--text);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.child-activity {
				--child-muted-readable: color-mix(in srgb, var(--muted-strong) 62%, var(--muted));
				margin-top: 12px;
				padding-top: 10px;
				border-top: 1px solid var(--line);
				overflow: hidden;
			}

			.account-privacy-toggle,
			.project-location-toggle,
			.project-work-info {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 20px;
				height: 20px;
				padding: 0;
				border: 0;
				border-radius: 999px;
				background: transparent;
				color: var(--muted-strong);
				cursor: pointer;
				transition:
					background-color var(--fast) var(--ease),
					color var(--fast) var(--ease);
			}

			.project-work-info {
				cursor: help;
			}

			.project-work-info-wrap {
				position: relative;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}

			.project-work-tooltip {
				position: absolute;
				z-index: 24;
				top: calc(100% + 7px);
				right: 0;
				width: max-content;
				max-width: 220px;
				padding: 5px 7px;
				border: 1px solid var(--line-strong);
				border-radius: var(--radius-sm);
				background: var(--surface);
				box-shadow: 0 8px 20px color-mix(in srgb, var(--shadow) 20%, transparent);
				color: var(--text);
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				line-height: 1.25;
				opacity: 0;
				pointer-events: none;
				text-align: left;
				transform: translateY(-2px);
				transition:
					opacity var(--fast) var(--ease),
					transform var(--fast) var(--ease);
			}

			.project-work-info-wrap:hover .project-work-tooltip,
			.project-work-info:focus-visible + .project-work-tooltip,
			.project-work-info.is-open + .project-work-tooltip {
				opacity: 1;
				pointer-events: auto;
				transform: translateY(0);
			}

			.account-privacy-toggle svg,
			.project-location-toggle svg,
			.project-work-info svg {
				display: block;
				width: 14px;
				height: 14px;
				stroke-width: 2;
			}

			.account-privacy-toggle .account-eye-open,
			.project-location-toggle .account-eye-open {
				display: none;
			}

			.account-privacy-toggle.is-on .account-eye-open,
			.project-location-toggle.is-on .account-eye-open {
				display: block;
			}

			.account-privacy-toggle.is-on .account-eye-off,
			.project-location-toggle.is-on .account-eye-off {
				display: none;
			}

			.account-privacy-toggle:hover,
			.project-location-toggle:hover,
			.project-work-info:hover {
				background: var(--surface-muted);
				color: var(--text);
			}

			.account-privacy-toggle:focus-visible,
			.project-location-toggle:focus-visible,
			.project-work-info:focus-visible {
				color: var(--text);
				outline: 2px solid var(--info);
				outline-offset: 2px;
			}

			.project-filter-toggle {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 20px;
				height: 20px;
				padding: 0;
				border: 0;
				border-radius: 999px;
				background: transparent;
				color: var(--muted-strong);
				cursor: pointer;
				transition:
					background-color var(--fast) var(--ease),
					color var(--fast) var(--ease);
			}

			.project-filter-toggle svg {
				display: block;
				width: 13px;
				height: 13px;
				stroke-width: 2;
			}

			.project-filter-toggle.is-on {
				color: var(--info);
			}

			.account-privacy-toggle.is-on,
			.project-location-toggle.is-on {
				color: var(--info);
			}

			.project-filter-toggle:hover {
				background: var(--surface-muted);
				color: var(--text);
			}

			.project-filter-toggle:focus-visible {

				line-height: 1.35;

			.run-meta-label {

				left: 0;

				height: 12px;
				color: var(--muted-strong);

				width: 12px;
				height: 12px;

			.run-meta-item strong {

				overflow-wrap: anywhere;

			.account-meta {

				align-items: center;
				gap: 4px 8px;
				min-width: 0;
				font-family: var(--mono);
				font-size: var(--type-caption);
				color: var(--muted);

			.account-meta span {

				align-items: baseline;
				gap: 3px;
				min-width: 0;
				overflow-wrap: anywhere;

				color: var(--muted-strong);

			.account-pool-activity-strip {

				min-width: 0;
				height: 8px;
				margin-top: 2px;
				overflow: hidden;
			}

			.account-profile-activity-strip {
				justify-self: center;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 2px;
				width: min(100%, 128px);
				min-width: 0;
				height: 8px;
				overflow: hidden;
			}

			.account-pool-activity-tile,

				display: block;
				flex: 0 0 6px;
				width: 6px;
				height: 8px;
				border-radius: 2px;
				background: var(--info);
				opacity: var(--account-activity-opacity, 0.28);

			#account-mode-meta {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 8px;
				max-width: min(760px, 72vw);
				letter-spacing: 0;
			}

			.account-mode-head {
				display: inline-flex;
				align-items: baseline;
				gap: 6px;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.account-pool {

				min-width: 0;
				overflow-x: auto;
				padding-bottom: 2px;
			}

			.account-pool-summary {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
				gap: 0;
				min-width: 0;
				padding: 8px 0 8px var(--space-row-indent);
				border-bottom: 1px solid color-mix(in srgb, var(--line) 58%, transparent);

			.account-pool-metric {

			.account-pool-metric-label {
				overflow: hidden;
				color: var(--muted);
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.account-pool-metric-value {
				overflow: hidden;
				color: var(--muted-strong);
				font-family: var(--mono);
				font-size: var(--type-row-title);
				font-weight: var(--weight-label);
				letter-spacing: 0;
				text-overflow: ellipsis;
				white-space: nowrap;

			.account-pool-metric-value[data-tone="run"] {
				color: var(--tone-run);
			}

			.account-pool-metric-value[data-tone="warning"] {
				color: var(--warning);
			}

			.account-pool-metric-value[data-tone="danger"] {
				color: var(--danger);
			}

			.account-pool-metric-value[data-tone="muted"] {
				color: var(--muted-strong);
			}

			.account-pool-summary-note {

				margin-top: 2px;
				color: var(--muted);
				font-family: var(--mono);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				line-height: 1.2;
			}

			.account-profile-panel {
				--account-accent: var(--tone-muted);
				position: relative;
				isolation: isolate;
				overflow: hidden;
				min-width: 0;
				max-height: 0;
				padding: 0 28px 0 var(--space-row-indent);
				border-bottom: 0 solid transparent;
				background: linear-gradient(
					90deg,
					color-mix(in srgb, var(--account-accent) 7%, transparent),
					transparent 72%
				);
				color: var(--muted);
				opacity: 0;
				pointer-events: none;
				transform: translateY(-4px);
				transition:
					max-height var(--medium) var(--ease),
					padding-bottom var(--medium) var(--ease),
					border-width var(--medium) var(--ease),
					border-color var(--medium) var(--ease),
					opacity var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.account-row.is-profile-open {
				border-bottom-color: color-mix(in srgb, var(--line) 34%, transparent);
			}

			.account-profile-panel.is-selected,
			.account-profile-panel.is-ready {
				--account-accent: var(--success);
			}

			.account-profile-panel.is-fixed {
				--account-accent: var(--info);
			}

			.account-profile-panel.is-warn {
				--account-accent: var(--warning);
			}

			.account-profile-panel.is-danger {
				--account-accent: var(--danger);
			}

			.account-profile-panel.is-open {
				max-height: 88px;
				padding-bottom: 10px;
				border-bottom-width: 1px;
				border-bottom-color: var(--line);
				opacity: 1;
				pointer-events: auto;
				transform: translateY(0);
			}

			.account-profile-panel-inner {
				display: grid;
				grid-template-columns: repeat(5, minmax(0, 1fr));
				align-items: center;
				gap: 8px var(--space-row-y);
				min-width: 0;
				padding: 8px 0 0;
			}

			.account-profile-fact,
			.account-profile-activity {
				display: grid;
				gap: 3px;
				min-width: 0;
				font-family: var(--mono);
				font-size: var(--type-caption);
				font-variant-numeric: tabular-nums;
				line-height: 1.15;
			}

			.account-profile-fact {
				justify-items: center;
				text-align: center;
			}

			.account-profile-fact span,
			.account-profile-activity-label {
				max-width: 100%;
				overflow: hidden;
				color: var(--muted);
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.account-profile-fact strong,
			.account-profile-empty {
				max-width: 100%;
				overflow: hidden;
				color: var(--muted-strong);
				font-weight: var(--weight-label);
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.account-profile-activity {
				justify-items: center;
				text-align: center;
			}

			.account-profile-panel:last-child {
				border-bottom: 0;
			}

			.account-pool-list {
				--account-grid: minmax(220px, 1.12fr) minmax(56px, 0.42fr) repeat(4, minmax(0, 1fr));
				--account-gap: var(--space-row-y);
				display: grid;
				min-width: 760px;
				background: transparent;
			}

			.account-pool-guide {
				display: grid;
				grid-template-columns: var(--account-grid);
				align-items: end;
				gap: var(--account-gap);
				min-width: 0;
				padding: 0 0 var(--space-sm) var(--space-row-indent);
				border-bottom: 1px solid color-mix(in srgb, var(--line) 58%, transparent);
				color: var(--muted);
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				line-height: 1.15;
			}

			.account-pool-sort {
				justify-self: center;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 4px;
				min-width: 0;
				max-width: 100%;
				padding: 0;
				border: 0;
				background: transparent;
				color: inherit;
				font: inherit;
				letter-spacing: inherit;
				line-height: inherit;
				text-align: center;
				text-transform: inherit;
				cursor: pointer;
				transition: color var(--fast) var(--ease);
			}

			.account-pool-heading {
				justify-self: center;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 5px;
				min-width: 0;
			}

			.account-pool-sort:hover,
			.account-pool-sort.is-active {
				color: var(--text);
			}

			.account-pool-sort:focus-visible {
				color: var(--text);
				outline: 2px solid var(--info);
				outline-offset: 3px;
			}

			.account-pool-sort-label {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.account-pool-sort-icon {
				display: block;
				flex: 0 0 auto;
				width: 8px;
				height: 12px;
			}

			.account-pool-sort-icon path {
				opacity: 0.38;
				transition: opacity var(--fast) var(--ease);
			}

			.account-pool-sort.is-asc .account-sort-up,
			.account-pool-sort.is-desc .account-sort-down {
				opacity: 1;
			}

			.account-row {
				--account-accent: var(--tone-muted);
				--account-confirm-accent: var(--tone-run);
				--account-confirm-cycle: 1.45s;
				position: relative;
				isolation: isolate;
				display: grid;
				grid-template-areas:
					"id plan primary secondary credit state"
					"meta meta meta meta meta meta";
				grid-template-columns: var(--account-grid);
				align-items: center;
				gap: 4px var(--account-gap);
				min-width: 0;
				min-height: 42px;
				padding: var(--space-account-row-y) 28px var(--space-account-row-y) var(--space-row-indent);
				border-bottom: 1px solid var(--line);
				background: transparent;
				transition:
					background-color var(--fast) var(--ease),
					color var(--fast) var(--ease);
			}

			.account-row.is-profile-toggleable {
				cursor: pointer;
			}

			.account-pool-list > .account-row.is-last-account {
				border-bottom: 0;
			}

			.account-row > * {
				position: relative;
				z-index: 1;
			}

			.account-row::before {
				content: "";
				position: absolute;
				z-index: 2;
				left: 0;
				top: calc(var(--space-account-row-y) - 1px);
				bottom: calc(var(--space-account-row-y) - 1px);
				width: 3px;
				background: var(--account-accent);
				box-shadow: none;
				transform-origin: left center;
				transition:
					background-color var(--fast) var(--ease),
					box-shadow var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.account-row::after {
				content: "";
				position: absolute;
				inset: 0 auto 0 0;
				z-index: 0;
				width: min(58%, 720px);
				background: linear-gradient(
					90deg,
					color-mix(in srgb, var(--account-accent) 12%, transparent),
					transparent 78%
				);
				opacity: 0;
				transform: scaleX(0.92);
				transform-origin: left center;
				transition:
					opacity var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.account-row.is-selected {
				--account-accent: var(--success);
			}

			.account-row.is-ready {
				--account-accent: var(--success);
			}

			.account-row.is-selected::before,
			.account-row.is-fixed::before {
				box-shadow: 0 0 10px color-mix(in srgb, var(--account-accent) 22%, transparent);
			}

			.account-row.is-selected::after,
			.account-row.is-fixed::after {
				opacity: 0.45;
				transform: scaleX(1);
			}

			.account-row.is-warn {
				--account-accent: var(--warning);
			}

			.account-row.is-danger {
				--account-accent: var(--danger);
			}

			.account-row.is-fixed {
				--account-accent: var(--info);
			}

			.account-row.is-warn::after,
			.account-row.is-danger::after {
				opacity: 0.35;
				transform: scaleX(1);
			}

			.account-row:hover,
			.account-row:focus-within {
				background: linear-gradient(90deg, var(--hover), transparent 78%);
			}

			.account-row:hover::before,
			.account-row:focus-within::before {
				box-shadow: 0 0 18px color-mix(in srgb, var(--account-accent) 42%, transparent);
				transform: scaleX(1.45) scaleY(1.08);
			}

			.account-row.is-armed:hover::before,
			.account-row.is-armed:focus-within::before {
				transform: none;
			}

			.account-row.is-armed:not(.is-selected):not(.is-fixed):hover::before,
			.account-row.is-armed:not(.is-selected):not(.is-fixed):focus-within::before {
				box-shadow: none;
			}

			.account-row.is-armed.is-selected:hover::before,
			.account-row.is-armed.is-selected:focus-within::before,
			.account-row.is-armed.is-fixed:hover::before,
			.account-row.is-armed.is-fixed:focus-within::before {
				box-shadow: 0 0 10px color-mix(in srgb, var(--account-accent) 22%, transparent);
			}

			.account-row:hover::after,
			.account-row:focus-within::after {
				opacity: 0.85;
				transform: scaleX(1);
			}

			@keyframes account-confirm-name-breathe {
				0%,
				100% {
					color: color-mix(in srgb, var(--account-confirm-accent) 46%, var(--muted));
					text-shadow: none;
				}
				50% {
					color: var(--account-confirm-accent);
					text-shadow:
						0 0 6px color-mix(in srgb, var(--account-confirm-accent) 34%, transparent),
						0 0 15px color-mix(in srgb, var(--account-confirm-accent) 20%, transparent);
				}
			}

			@keyframes account-confirm-bracket-left {
				0%,
				100% {
					opacity: 0.36;
					transform: translate(0.18ch, -50%);
				}
				50% {
					opacity: 0.98;
					transform: translate(-0.12ch, -50%);
				}
			}

			@keyframes account-confirm-bracket-right {
				0%,
				100% {
					opacity: 0.36;
					transform: translate(-0.18ch, -50%);
				}
				50% {
					opacity: 0.98;
					transform: translate(0.12ch, -50%);
				}
			}

			.account-row-id {
				grid-area: id;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				justify-self: stretch;
				gap: 6px;
				min-width: 0;
				font-family: var(--mono);
				font-variant-ligatures: none;
				letter-spacing: 0;
				text-align: center;
			}

			.account-row-id strong {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--text);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
			}

			.account-name-button {
				position: relative;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 0;
				max-width: 100%;
				padding: 0 2px;
				border: 0;
				background: transparent;
				color: var(--text);
				font-family: var(--mono);
				font-size: var(--type-label);
				font-variant-ligatures: none;
				font-weight: var(--weight-label);
				letter-spacing: 0;
				line-height: 1.25;

					color var(--fast) var(--ease),
					text-shadow var(--medium) var(--ease);

			.account-name-button::before,
			.account-name-button::after {
				position: absolute;
				top: 50%;
				display: block;
				color: var(--account-confirm-accent);
				font-weight: var(--weight-strong);
				line-height: 1;
				opacity: 0;
				pointer-events: none;
				text-shadow:
					0 0 8px color-mix(in srgb, var(--account-confirm-accent) 42%, transparent),

			.account-name-button::before {
				content: ">";
				left: -1.35ch;
				transform: translate(0.18ch, -50%);
			}

			.account-name-button::after {
				content: "<";
				right: -1.35ch;
				transform: translate(-0.18ch, -50%);
			}

			.account-name-button .account-name {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.account-name-button:hover,
			.account-name-button.is-fixed {
				color: var(--account-confirm-accent);
			}

			.account-name-button.is-fixed {
				text-shadow:

				will-change: color, text-shadow;
			}

			.account-name-button.is-armed::before {
				animation: account-confirm-bracket-left var(--account-confirm-cycle) var(--ease) infinite;
			}

			.account-name-button.is-armed::after {
				animation: account-confirm-bracket-right var(--account-confirm-cycle) var(--ease) infinite;
			}

			.account-name-button:focus-visible {
				outline: 2px solid var(--info);
				outline-offset: 4px;
			}

			.account-name-reroll {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				flex: 0 0 auto;
				width: 16px;
				height: 16px;
				padding: 0;
				border: 0;
				border-radius: 999px;
				background: transparent;
				color: var(--muted);
				cursor: pointer;
				transition:
					background-color var(--fast) var(--ease),
					color var(--fast) var(--ease);
			}

			.account-profile-toggle {
				position: absolute;
				z-index: 3;
				top: 50%;
				right: 5px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 18px;
				height: 24px;
				padding: 0;
				border: 0;
				border-radius: var(--radius-sm);
				background: transparent;
				color: var(--muted);

				opacity: 0.58;
				transform: translateY(-50%);

					background-color var(--fast) var(--ease),

					opacity var(--fast) var(--ease);

				transform: rotate(180deg);

			.account-row:hover .account-profile-toggle,
			.account-row:focus-within .account-profile-toggle,
			.account-name-reroll:hover,
			.account-profile-toggle:hover,
			.account-profile-toggle[aria-expanded="true"] {
				background: var(--surface-muted);
				color: var(--text);
				opacity: 1;
			}

			.account-name-reroll:focus-visible,
			.account-profile-toggle:focus-visible {
				color: var(--text);
				outline: 2px solid var(--info);
				outline-offset: 2px;
			}

			.account-row-plan {
				grid-area: plan;
				justify-self: center;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				color: var(--muted);
				font-family: var(--sans);
				font-size: var(--type-label);
				font-weight: 500;
				line-height: 1.2;
				text-align: center;
				white-space: nowrap;
			}

			.account-window {
				display: inline-grid;
				grid-template-columns: max-content max-content;
				justify-content: center;
				justify-items: center;
				align-items: baseline;
				gap: 1px 5px;
				min-width: 0;
				width: 100%;
				font-family: var(--mono);
				line-height: 1.18;
				text-align: center;
				transition:
					color var(--fast) var(--ease);
			}

			.account-row:hover .account-window,
			.account-row:focus-within .account-window {
				color: var(--text);
			}

			.account-window.is-primary {
				grid-area: primary;
				justify-self: stretch;
				min-width: 0;
			}

			.account-window.is-secondary {
				grid-area: secondary;
				justify-self: stretch;
				min-width: 0;
			}

			.account-window-label {
				display: none;
				color: var(--muted);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
			}

			.account-window > strong {
				display: inline;
				grid-column: 1;
				grid-row: 1;
				color: var(--text);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				line-height: 1.15;
			}

			.account-window.is-danger > strong {
				color: var(--danger);
			}

			.account-window.is-warn > strong {
				color: var(--warning);
			}

			.account-window-reset {
				display: inline;
				grid-column: 2;
				grid-row: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				color: var(--muted);
				font-family: var(--mono);
				font-size: var(--type-label);
				line-height: 1.08;
				white-space: nowrap;
			}

			.account-window-date {
				grid-column: 1 / -1;
				grid-row: 2;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				color: var(--muted);
				font-family: var(--mono);
				font-size: var(--type-caption);
				line-height: 1.12;
				white-space: nowrap;
			}

			.account-row-state {
				grid-area: state;
				justify-self: stretch;
				display: flex;
				justify-content: center;
				min-width: 0;
				width: auto;
				text-align: center;
				font-family: var(--sans);
				font-size: var(--type-label);
				color: var(--muted);
			}

			.account-row-credit {
				grid-area: credit;
				justify-self: center;
				display: inline-flex;
				align-items: baseline;
				justify-content: center;
				min-width: 0;
				font-family: var(--mono);
				font-size: var(--type-label);
				line-height: 1.2;
				text-align: center;
				white-space: nowrap;
				color: var(--muted);
			}

			.account-row-credit span {
				display: none;
			}

			.account-row-credit strong {
				color: var(--text);
				font-weight: var(--weight-label);
			}

			.account-row-credit.is-danger strong {
				color: var(--danger);
			}

			.account-status {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				min-width: 0;
				color: var(--muted-strong);
				font-weight: var(--weight-label);
				line-height: 1.25;
				white-space: nowrap;
				transition:
					color var(--fast) var(--ease);
			}

			.account-status::before {
				content: "";
				flex: 0 0 auto;
				width: 5px;
				height: 5px;
				border-radius: 999px;
				background: var(--account-accent);
				box-shadow: 0 0 6px color-mix(in srgb, var(--account-accent) 28%, transparent);
				transition:
					box-shadow var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.account-row.is-selected .account-status,
			.account-row.is-fixed .account-status,
			.account-row.is-ready .account-status {
				color: var(--account-accent);
			}

			.account-row.is-warn .account-status,
			.account-row.is-danger .account-status {
				color: var(--account-accent);
			}

			.account-row:hover .account-status::before,
			.account-row:focus-within .account-status::before {
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--account-accent) 12%, transparent);
				transform: scale(1.08);
			}

			.account-row-meta {
				grid-area: meta;
				grid-column: 1 / -1;
			}

			.child-activity-head {
				display: grid;
				grid-template-columns: 96px minmax(0, 1fr);
				align-items: baseline;
				gap: 10px;
				min-width: 0;
				font-family: var(--mono);
				font-size: var(--type-caption);
				line-height: 1.4;
				color: var(--child-muted-readable);
			}

			.child-activity-note {
				color: var(--child-muted-readable);
			}

			.child-activity-body {
				display: grid;
				gap: 4px;
				margin-top: 0;
			}

			.child-activity-head strong,
			.child-context strong {
				color: var(--text);
				font-weight: var(--weight-label);
			}

			.child-activity-head.is-project strong {
				color: var(--muted-strong);
			}

			.child-share-list {
				display: grid;
				gap: 6px;
			}

			.child-bucket {
				display: grid;
				--child-bucket-value-column: clamp(190px, 18vw, 230px);
				grid-template-columns: 96px minmax(64px, 1fr) var(--child-bucket-value-column);
				align-items: center;
				gap: 10px;
				min-width: 0;
				font-family: var(--mono);
				font-size: var(--type-caption);
				color: var(--child-muted-readable);
			}

			.child-bucket.is-event-only,
			.child-bucket.is-diagnostic {
				color: var(--muted-strong);
			}

			.child-diagnostic-grid {
				display: grid;
				gap: 6px;
				padding-top: 9px;
				border-top: 1px solid var(--line);
			}

			.child-diagnostic-grid .child-bucket.is-event-only,
			.child-diagnostic-grid .child-bucket.is-diagnostic {
				display: grid;
				grid-template-columns: 96px minmax(0, 1fr);
				align-items: baseline;
				gap: 10px;
			}

			.child-bucket-name,
			.child-bucket-value {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.child-bucket-name {
				min-width: 0;
			}

			.child-bucket-value {
				color: var(--text);
				font-weight: var(--weight-label);
				justify-self: end;
				width: var(--child-bucket-value-column);
				min-width: 0;
				text-align: right;
				overflow: visible;
				font-variant-numeric: tabular-nums;
			}

			.child-bucket-signals {
				display: flex;
				flex-wrap: wrap;
				gap: 4px 10px;
				min-width: 0;
				line-height: 1.35;
			}

			.child-context {
				display: grid;
				grid-template-columns: 96px minmax(0, 1fr);
				align-items: baseline;
				gap: 10px;
				padding-top: 8px;
				border-top: 1px solid var(--line);
				font-family: var(--mono);
				font-size: var(--type-caption);
				color: var(--child-muted-readable);
			}

			.child-context-group {
				display: grid;
				gap: 5px;
				width: 100%;
				max-width: 100%;
				padding-top: 9px;
				border-top: 1px solid var(--line);
			}

			.child-context-group .child-context {
				padding-top: 0;
				border-top: 0;
			}

			.child-total-overview {
				display: inline-grid;
				grid-template-columns:
					minmax(86px, max-content)
					repeat(4, max-content max-content);
				align-items: baseline;
				gap: 3px 0.38em;
				width: fit-content;
				max-width: 100%;
				overflow: hidden;
				font-family: var(--mono);
				font-size: var(--type-caption);
				color: var(--child-muted-readable);
			}

			.child-total-label {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--muted-strong);
			}

			.child-total-segment {
				display: contents;
			}

			.child-total-segment.is-empty > * {
				visibility: hidden;
			}

			.child-total-primary {
				color: var(--text);
				font-weight: var(--weight-label);
				font-variant-numeric: tabular-nums;
				justify-self: end;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.child-total-primary[data-slot] {
				padding-left: clamp(18px, 1.45vw, 26px);
			}

			.child-total-secondary {
				color: var(--child-muted-readable);
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.child-phase-table {
				display: inline-grid;
				grid-template-columns:
					max-content
					max-content
					max-content
					max-content
					max-content
					max-content
					max-content;
				gap: 4px clamp(24px, 2vw, 34px);
				align-items: baseline;
				width: fit-content;
				max-width: 100%;
				overflow: hidden;
				margin-top: 2px;
				padding-top: 5px;
				border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
				font-family: var(--mono);
				font-size: var(--type-caption);
				color: var(--child-muted-readable);
			}

			.child-phase-table-cell {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.child-phase-table-cell[data-align="right"] {
				justify-self: end;
				text-align: right;
			}

			.child-phase-table-cell.is-header {
				color: var(--child-muted-readable);
				font-size: var(--type-meta);
			}

			.child-phase-table-cell.is-value {
				color: var(--text);
				font-weight: var(--weight-label);
				font-variant-numeric: tabular-nums;
			}

			.child-context-label {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.child-context-values {
				display: flex;
				flex-wrap: wrap;
				gap: 4px 14px;
				min-width: 0;
			}

			.child-context-values > span {
				min-width: 0;
				overflow-wrap: anywhere;
			}

			.child-bucket-signal {
				display: inline-flex;
				align-items: baseline;
				gap: 4px;
				min-width: 0;
				white-space: nowrap;
			}

			.child-bucket-signal span {
				color: var(--muted);
			}

			.child-bucket-signal strong {
				color: var(--text);
				font-weight: var(--weight-label);
			}

			.child-bucket-bar {
				position: relative;
				height: 6px;
				background: var(--line);
				overflow: hidden;
			}

			.child-bucket-bar > span {
				position: absolute;
				inset: 0 auto 0 0;
				width: var(--bucket-width, 0%);
				background: currentColor;
				opacity: 0.75;
				transition:
					width var(--slow) var(--ease),
					opacity var(--fast) var(--ease);
			}

			.status-label {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-family: var(--sans);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
			}

			.status-label::before {
				content: "";
				width: 2px;
				height: 12px;
				background: currentColor;
			}

			.success {
				color: var(--success);
			}

			.warning {
				color: var(--warning);
			}

			.danger {
				color: var(--danger);
			}

			.info {
				color: var(--info);
			}

			.tone-queue {
				--accent: var(--tone-queue);
				color: var(--tone-queue);
			}

			.tone-ready {
				--accent: var(--tone-ready);
				color: var(--tone-ready);
			}

			.tone-run {
				--accent: var(--tone-run);
				color: var(--tone-run);
			}

			.tone-review {
				--accent: var(--tone-review);
				color: var(--tone-review);
			}

			.tone-land {
				--accent: var(--tone-land);
				color: var(--tone-land);
			}

			.tone-wait {
				--accent: var(--tone-wait);
				color: var(--tone-wait);
			}

			.tone-blocked {
				--accent: var(--tone-blocked);
				color: var(--tone-blocked);
			}

			.tone-repair {
				--accent: var(--tone-repair);
				color: var(--tone-repair);
			}

			.tone-retained {
				--accent: var(--tone-retained);
				color: var(--tone-retained);
			}

			.tone-recovery {
				--accent: var(--tone-recovery);
				color: var(--tone-recovery);
			}

			.tone-muted {
				--accent: var(--tone-muted);
				color: var(--tone-muted);
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 12px 14px;
				margin-top: 14px;
				padding-top: 0;
				border-top: 0;
			}

			details > .grid {
				margin-top: 12px;
				padding-top: 0;
				border-top: 0;
			}

			.debug-grid {
				grid-template-columns: repeat(4, minmax(0, 1fr));
			}

			.grid.two {
				grid-template-columns: minmax(0, 1fr) minmax(150px, 0.72fr);
			}

			.card-facts {
				gap: 13px clamp(24px, 8vw, 96px);
				align-items: start;
			}

			.field {
				display: grid;
				gap: 5px;
				min-width: 0;
			}

			.field-label {
				font-family: var(--sans);
				font-size: var(--type-caption);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				color: var(--muted);
			}

			.field-value {
				font-family: var(--mono);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				font-variant-numeric: tabular-nums;
				line-height: 1.35;
				word-break: break-word;
				color: var(--text);
			}

			.field-value.is-time,
			.field-value.is-muted {
				font-size: var(--type-meta);
				font-weight: 500;
				color: var(--muted-strong);
			}

			.attention-facts {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 16px;
				margin-top: 10px;
				padding-top: 10px;
				border-top: 1px solid var(--line);
				font-family: var(--mono);
				font-size: var(--type-caption);
				line-height: 1.45;
				color: var(--muted);
			}

			.attention-facts span {
				min-width: 0;
				overflow-wrap: anywhere;
			}

			.attention-facts strong {
				color: var(--text);
				font-weight: var(--weight-label);
			}

			details {
				margin-top: 12px;
				padding-top: 0;
				border-top: 0;
			}

			summary {
				cursor: pointer;
				font-family: var(--sans);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				letter-spacing: var(--tracking-caps);
				color: var(--muted);
				user-select: none;
				transition:
					color var(--fast) var(--ease);
			}

			summary:hover {
				color: var(--text);
			}

			details[data-detail-key] > summary {
				display: inline-flex;
				align-items: center;
				list-style: none;
				position: relative;
				padding-left: 18px;
			}

			details[data-detail-key] > summary::-webkit-details-marker {
				display: none;
			}

			details[data-detail-key] > summary::before,
			details[data-detail-key] > summary::after {
				content: "";
				position: absolute;
				left: 0;
				top: 50%;
				width: 10px;
				height: 1.5px;
				border-radius: 999px;
				background: currentColor;
				transform: translateY(-50%);
				transition:
					opacity var(--slow) var(--ease),
					transform var(--slow) var(--ease),
					background-color var(--fast) var(--ease);
			}

			details[data-detail-key] > summary::after {
				transform: translateY(-50%) rotate(90deg);
			}

			details[data-detail-key][data-detail-state="open"] > summary::after {
				opacity: 0;
				transform: translateY(-50%) rotate(0deg);
			}

			details.is-animating > .grid,
			details.is-animating > .phase-list,
			details.is-animating > .panel-body {
				overflow: hidden;
				transform-origin: top center;
				transition:
					height var(--slow) var(--ease),
					opacity var(--slow) var(--ease),
					transform var(--slow) var(--ease);
			}

			.phase-timeline {
				margin-top: 12px;
			}

			.phase-list {
				display: grid;
				gap: 0;
				margin-top: 8px;
				border-top: 1px solid var(--line);
			}

			.phase-row {
				display: grid;
				grid-template-columns: minmax(112px, 0.28fr) minmax(0, 1fr);
				gap: 12px 16px;
				align-items: start;
				min-width: 0;
				padding: 8px 0;
				border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
			}

			.phase-row:last-child {
				border-bottom: 0;
			}

			.phase-name,
			.phase-facts,
			.phase-facts span {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.phase-name {
				color: var(--text);
				font-family: var(--sans);
				font-size: var(--type-label);
				font-weight: var(--weight-label);
				line-height: 1.35;
			}

			.phase-facts {
				display: flex;
				flex-wrap: wrap;
				gap: 5px 14px;
				align-items: baseline;
				font-family: var(--mono);
				font-size: var(--type-caption);
				line-height: 1.45;
				color: var(--muted);
			}

			.phase-facts strong {
				color: var(--muted-strong);
				font-weight: var(--weight-label);
			}

			details.fold-panel {
				margin-top: 0;
				padding-top: 0;
				border-top: 0;
			}

			details.fold-panel.is-animating > .panel-body {
				transition:
					height var(--medium) var(--ease),
					opacity var(--medium) var(--ease),
					transform var(--medium) var(--ease);
			}

			.fold-panel > summary.panel-head {
				cursor: pointer;
				font: inherit;
				letter-spacing: 0;
				text-transform: none;
				color: inherit;
				list-style: none;
			}

			.fold-panel > summary.panel-head::-webkit-details-marker {
				display: none;
			}

			.fold-panel > summary.panel-head:focus {
				outline: none;
			}

			.fold-panel > summary.panel-head:focus-visible {
				outline: 2px solid var(--info);
				outline-offset: 2px;
			}

			.fold-panel.is-empty > .panel-body {
				display: block;
			}

			.summary-tools {
				display: grid;
				grid-template-columns: minmax(0, max-content) 14px;
				align-items: center;
				justify-content: end;
				gap: var(--space-md);
				text-align: right;
			}

			.summary-tools .table-meta {
				white-space: nowrap;
			}

			.fold-indicator {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 14px;
				height: 14px;
				color: var(--muted);
				font-family: var(--mono);
				font-size: var(--type-row-title);
				font-weight: var(--weight-label);
				letter-spacing: 0;
				line-height: 1;
				transition:
					color var(--fast) var(--ease);
			}

			.fold-indicator::before {
				content: "+";
			}

			details[data-detail-state="open"] > summary .fold-indicator::before {
				content: "-";
			}

			.fold-panel > summary:hover .fold-indicator {
				color: var(--text);
			}

			.empty-state {
				display: grid;
				grid-template-columns: minmax(118px, max-content);
				align-items: center;
				gap: var(--space-2xs) var(--space-md);
				max-width: 640px;

			function escapeHtml(value) {
				return String(value).replace(/[&<>"']/g, (character) => {
					switch (character) {
						case "&":
							return "&amp;";
						case "<":
							return "&lt;";
						case ">":
							return "&gt;";
						case "\"":
							return "&quot;";
						case "'":
							return "&#39;";
						default:
							return character;
					}
				});
			}

			function encodeLocalPath(path) {
				return path
					.split("/")
					.map((segment, index) => (index === 0 ? "" : encodeURIComponent(segment)))
					.join("/");
			}

			function localPathHref(value) {
				const rawValue = String(value || "").trim();
				if (
					!rawValue.startsWith("/") ||
					rawValue.startsWith("//") ||
					/[\n\r]/.test(rawValue) ||
					!["/Users/", "/Volumes/", "/tmp/", "/private/", "/var/", "/opt/", "/home/"].some((prefix) =>
						rawValue.startsWith(prefix),
					)
				) {
					return "";
				}

				return `file://${encodeLocalPath(rawValue)}`;
			}

			function linkHref(value) {
				const rawValue = String(value || "").trim();
				return /^(https?|wss?):\/\//i.test(rawValue) ? rawValue : localPathHref(rawValue);
			}

			function linkValueLabel(label, value) {
				const text = String(value || "").trim();
				const labelKey = detailLabel(label).toLowerCase();
				const pullRequestMatch = text.match(/\/pull\/(\d+)(?:$|[/?#])/);
				if (labelKey === "pr" && pullRequestMatch) {
					return `#${pullRequestMatch[1]}`;
				}

				return text;
			}

			function renderValueLink(label, value, className = "value-link") {
				const href = linkHref(value);
				if (!href) {
					return "";
				}

				return `<a class="${className}" href="${escapeHtml(href)}" target="_blank" rel="noreferrer" title="${escapeHtml(href)}">${escapeHtml(linkValueLabel(label, value))}</a>`;

			function scrollOpenedDetailIntoView(details, content) {
				if (reducedMotionQuery.matches) {
					return;

				window.requestAnimationFrame(() => {
					const viewportHeight =
						window.innerHeight || document.documentElement.clientHeight;
					const contentRect = content.getBoundingClientRect();
					const targetBottom = Math.min(
						contentRect.bottom,
						contentRect.top + Math.min(content.scrollHeight, viewportHeight * 0.62),
					);
					const overflow = targetBottom - (viewportHeight - 28);

							top: overflow,
							behavior: "smooth",

				});

			function animateDetail(details, shouldOpen) {
				const content = detailContent(details);
				rememberDetailOpenState(details, shouldOpen);

				const existingTimer = detailAnimationTimers.get(details);
				if (existingTimer) {
					window.clearTimeout(existingTimer);
					detailAnimationTimers.delete(details);
				}

				if (!content || reducedMotionQuery.matches) {
					details.open = shouldOpen;
					setDetailVisualState(details, shouldOpen);
					return;
				}

				const isFoldPanel = details.classList.contains("fold-panel");
				const animationMs = isFoldPanel ? FOLD_PANEL_ANIMATION_MS : DETAILS_ANIMATION_MS;
				const openingOffset = isFoldPanel ? "translateY(-3px)" : "translateY(-6px)";
				const startHeight = details.open
					? content.getBoundingClientRect().height
					: 0;

				details.open = true;
				setDetailVisualState(details, shouldOpen);
				details.classList.add("is-animating");
				content.style.overflow = "hidden";
				content.style.height = `${startHeight}px`;
				content.style.opacity = shouldOpen ? "0" : "1";
				content.style.transform = shouldOpen ? openingOffset : "translateY(0)";

				const finishTimer = window.setTimeout(() => {
					if (!shouldOpen) {
						details.open = false;
					}
					clearDetailAnimation(details, content);
					if (shouldOpen && !isFoldPanel) {
						scrollOpenedDetailIntoView(details, content);
					}
					detailAnimationTimers.delete(details);
				}, animationMs + 60);

				detailAnimationTimers.set(details, finishTimer);

				window.requestAnimationFrame(() => {
					const endHeight = shouldOpen ? content.scrollHeight : 0;
					content.style.height = `${endHeight}px`;
					content.style.opacity = shouldOpen ? "1" : "0";
					content.style.transform = shouldOpen ? "translateY(0)" : openingOffset;

					if (shouldOpen && !isFoldPanel) {
						scrollOpenedDetailIntoView(details, content);
					}
				});
			}

			function syncElementAttributes(current, next) {
				for (const attribute of [...current.attributes]) {
					if (!next.hasAttribute(attribute.name)) {
						current.removeAttribute(attribute.name);
					}
				}

				for (const attribute of [...next.attributes]) {
					if (current.getAttribute(attribute.name) !== attribute.value) {
						current.setAttribute(attribute.name, attribute.value);
					}
				}

			function patchNode(current, next) {
				if (
					current.nodeType !== next.nodeType ||
					current.nodeName !== next.nodeName
				) {
					current.replaceWith(next.cloneNode(true));
					return;
				}

				if (current.nodeType === Node.TEXT_NODE) {
					if (current.nodeValue !== next.nodeValue) {
						current.nodeValue = next.nodeValue;
					}
					return;
				}

				if (!(current instanceof Element) || !(next instanceof Element)) {
					return;
				}

				// Preserve active accordion animation styles until their timer clears them.
				if (
					current.closest("details.is-animating") &&
					!(current instanceof HTMLDetailsElement)
				) {
					return;
				}

				if (current instanceof HTMLDetailsElement) {
					const detailKey = detailStateKey(current);
					if (detailKey && detailDisclosureState.has(detailKey)) {
						const shouldOpen = detailDisclosureState.get(detailKey);
						if (shouldOpen) {
							next.setAttribute("open", "");
							next.dataset.detailState = "open";
						} else {
							next.removeAttribute("open");
							delete next.dataset.detailState;
						}
					}
				}

				syncElementAttributes(current, next);
				patchChildNodes(current, next, false);
			}

					const minutes = Math.floor((value % 3_600) / 60);
					const parts = [];

					if (days > 0) {
						parts.push(`${days}d`);
						if (hours > 0) {
							parts.push(`${hours}h`);
						}

					if (hours > 0) {

				function compareCodexAccountPoolColumn(left, right, key, direction) {
					const leftValue = codexAccountPoolColumnSortValue(left, key);
					const rightValue = codexAccountPoolColumnSortValue(right, key);
					const leftMissing = leftValue == null || leftValue === "";
					const rightMissing = rightValue == null || rightValue === "";
					if (leftMissing && rightMissing) {
						return 0;
					}
					if (leftMissing) {
						return 1;
					}
					if (rightMissing) {
						return -1;
					}

					const delta =
						typeof leftValue === "number" && typeof rightValue === "number"
							? leftValue === rightValue
								? 0
								: leftValue < rightValue
									? -1
									: 1
							: String(leftValue).localeCompare(String(rightValue));

					return direction === "desc" ? -delta : delta;

							right,
							accountPoolSort.key,
							accountPoolSort.direction,

						if (columnDelta) {

			function historyLaneTimingFacts(lane) {

					["Elapsed", formatDuration(outcome.lifecycle_elapsed_seconds)],
					["Attempts", String(metrics.attempt_count || lane.attempt_count || 1)],
					[activityLabel, formatDuration(activitySeconds)],

				const outputTokens = childBucketMetricNumber(bucket, "output_tokens");
				const outputBytes = childBucketMetricNumber(bucket, "output_bytes");

				if (toolCalls > 0) {
					signals.push(["tools", formatCompactCount(toolCalls)]);
