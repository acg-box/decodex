					const note = codexAccountNote(account);
					return Boolean(
						codexAccountRefreshFailed(account) ||
							codexAccountNoteLooksError(note) ||
							status.includes("failed") ||
							status.includes("unusable"),
					);
				}

				function codexAccountNoticeTitle(account) {
					if (codexAccountRefreshFailed(account)) {
						return "Codex account token";
					}
					if (codexAccountNoteLooksError(codexAccountNote(account))) {
						return "Codex account usage";
					}

					return "Codex account";
				}

				function codexAccountNoticeCopy(account) {
					const note = codexAccountNote(account);
					const parts = [];
					const noteIncludesRefreshFailure = /refresh failed|token refresh failed/i.test(note);
					if (note && !codexAccountNoteLooksRoutine(note)) {
						parts.push(codexAccountPrivacyText(account, note));
					}
					if (codexAccountRefreshFailed(account) && !noteIncludesRefreshFailure) {
						parts.unshift(codexAccountTokenLabel(account.refresh_status));
					}
					if (!parts.length) {
						parts.push(codexAccountStatusLabel(account));
					}

					return `${codexAccountPrivacyLabel(account)}: ${parts.join("; ")}`;
				}

				function codexAccountNotices(snapshot) {
					const notices = [];
					const seen = new Set();
					for (const account of codexAccountPoolAccounts(snapshot)) {
						if (!codexAccountHasNotice(account)) {
							continue;
						}
						const notice = {
							tone: "danger",
							title: codexAccountNoticeTitle(account),
							copy: codexAccountNoticeCopy(account),
						};
						const key = `${notice.title}:${notice.copy}`;
						if (seen.has(key)) {
							continue;
						}
						seen.add(key);
						notices.push(notice);
					}

					return notices;
				}

				function warningDetailsFor(warning, snapshot) {
					return (snapshot?.warning_details ?? []).filter((detail) => detail?.warning === warning);
				}

				function warningNotice(warning, snapshot) {
					const details = warningDetailsFor(warning, snapshot);
					if (warning === "worktree_hygiene_unavailable" && details.length) {
						return {
							tone: "warning",
							title: "Worktree hygiene unavailable",
							copy: details.map(worktreeHygieneWarningCopy).join(" "),
						};
					}

					return {
						tone: "warning",
						title: "Snapshot warning",
						copy: displayToken(warning),
					};
				}

				function worktreeHygieneWarningCopy(detail) {
					const project = detail.project_id || "project";
					const repo = detail.repo_root ? ` Repo: ${detail.repo_root}.` : "";
					const reason = detail.reason || "Worktree hygiene scan failed.";
					const nextAction = detail.next_action ? ` ${detail.next_action}` : "";

					return `${project}: ${reason}.${repo}${nextAction}`;
				}

			function renderNoticeDock(notices) {
				const hasNotices = notices.length > 0;
				nodes.noticeDock.classList.toggle("visible", hasNotices);
				nodes.noticeDock.setAttribute("aria-hidden", hasNotices ? "false" : "true");

				if (!hasNotices) {
					nodes.noticeDock.removeAttribute("open");
					delete nodes.noticeDock.dataset.tone;
					nodes.noticeCount.textContent = "0";
					nodes.noticeLabel.textContent = "notices";
					nodes.noticeList.innerHTML = "";

					return;
				}

				const tone = notices.some((notice) => notice.tone === "danger") ? "danger" : "warning";
				const dangerCount = notices.filter((notice) => notice.tone === "danger").length;
				nodes.noticeDock.dataset.tone = tone;
				nodes.noticeCount.textContent = String(notices.length);
				nodes.noticeLabel.textContent =
					dangerCount > 0
						? pluralLabel(notices.length, "alert")
						: pluralLabel(notices.length, "warning");
				nodes.noticeList.innerHTML = notices
					.map(
						(notice) => `
							<article class="notice-item ${notice.tone}">
								<strong>${escapeHtml(notice.title)}</strong>
								<p>${escapeHtml(notice.copy)}</p>
								${notice.ackKey ? `<button class="control-button" type="button" data-notice-ack="${escapeHtml(notice.ackKey)}">Ack</button>` : ""}
							</article>
						`,
					)
					.join("");
			}

			function buildDerivedState(snapshot) {
				const currentLaneCards = snapshotCurrentLaneCards(snapshot);
				const currentLanes = currentLaneRunsFromCards(currentLaneCards);
				const recentRuns = snapshot?.recent_runs ?? [];
				const historyRuns = sessionHistoryRuns(snapshot);
				const executionPrograms = snapshot?.execution_programs ?? [];
				const postReviewLanes = snapshot?.post_review_lanes ?? [];
				const postReviewIssueKeys = new Set(postReviewLanes.flatMap(issueIdentityKeys));
				const currentLaneByIssue = new Map();
				for (const run of currentLanes) {
					for (const key of issueIdentityKeys(run)) {
						if (!currentLaneByIssue.has(key)) {
							currentLaneByIssue.set(key, run);
						}
					}
				}
				const queuedCandidates = [...(snapshot?.queued_candidates ?? [])]
					.map((candidate) => {
						const currentLane = issueIdentityKeys(candidate)
							.map((key) => currentLaneByIssue.get(key))
							.find(Boolean);

						if (currentLane) {
							return {
								...candidate,
								display_classification: "leased_run",
								current_lane_run_id: currentLane.run_id,
							};
						}

						return candidate;
					})
					.sort(compareQueuedCandidates);
				const queueBacklogCandidates = queuedCandidates.filter(
					(candidate) =>
						candidate.display_classification !== "leased_run" &&
						candidate.classification !== "closed" &&
						!issueMatchesKeySet(candidate, postReviewIssueKeys),
				);
				const reviewOwnedQueueCount = queuedCandidates.filter(
					(candidate) =>
						candidate.display_classification !== "leased_run" &&
						candidate.classification !== "closed" &&
						issueMatchesKeySet(candidate, postReviewIssueKeys),
				).length;
				const staleClosedCandidates = queuedCandidates.filter(
					(candidate) => candidate.classification === "closed",
				);
				const worktrees = snapshot?.worktrees ?? [];
				const cleanupIssueKeys = new Set();
				for (const worktree of worktrees) {
					if (worktree.hygiene) {
						cleanupIssueKeys.add(issueDisplayKey(worktree));
					}
				}
				const waitingItems = [];
				const readyItems = [];
				const attentionItems = [];

				for (const run of currentLanes) {
					const tone = toneForRun(run);
					const issueKey = issueDisplayKey(run);

					if (runNeedsAttention(run)) {
						attentionItems.push({
							tone: "tone-blocked",
							scope: "Running",
							issue: issueKey,
							title: runStoppedProcessNeedsAttention(run)
								? "Stopped agent process"
								: displayToken(run.run_phase || run.phase || run.status),
							summary: runStoppedProcessNeedsAttention(run)
								? `Agent process stopped while lane remains active. ${COPY.protocolEvent} ${run.last_event_type || "none"}.`
								: runStaleWithoutKnownProcessNeedsAttention(run)
									? `No live agent process after ${formatDuration(runStaleWithoutKnownProcessAgeSeconds(run))}; lane remains active.`
									: `No confirmed progress for ${formatDuration(run.idle_for_seconds)}. ${COPY.protocolEvent} ${run.last_event_type || "none"}.`,
							status: runStoppedProcessNeedsAttention(run)
								? "attention stopped"
								: `run phase ${displayToken(run.run_phase || run.phase)}`,
							facts: [
								["Codex thread", runThreadSummary(run)],
								["Thread flags", runThreadFlagSummary(run)],
								["Process", runProcessSummary(run)],
								currentLaneFreshnessFact(run),
								["Protocol idle", formatDuration(run.protocol_idle_for_seconds)],
								["Last progress", formatTimestamp(run.last_progress_at)],
								[COPY.protocolEvent, protocolEventSummary(run)],
								["Branch", run.branch_name || "none"],
								["Next retry", formatTimestamp(run.next_retry_at)],
							],
						});
						continue;
					}

					const runIsWaiting =
						run.phase === "retry_backoff" ||
						run.phase === "waiting_continuation" ||
						(run.wait_reason && !runWaitReasonShowsExecutionProgress(run));

					if (runIsWaiting) {
						waitingItems.push({
							tone,
							scope: "Running",
							issue: issueKey,
							title: displayToken(run.run_phase || run.phase || run.status),
							summary: run.next_retry_at
								? `Retry scheduled for ${formatTimestamp(run.next_retry_at)}.`
								: `Waiting on ${displayToken(run.wait_reason || run.run_phase || run.phase)}.`,
							status: "waiting",
							facts: [
								["Codex thread", runThreadSummary(run)],
								["Thread flags", runThreadFlagSummary(run)],
								currentLaneFreshnessFact(run),
								["Lane idle", formatDuration(run.idle_for_seconds)],
								["Protocol idle", formatDuration(run.protocol_idle_for_seconds)],
								[COPY.protocolEvent, protocolEventSummary(run)],
								["Branch", run.branch_name || "none"],
								["Worktree", run.worktree_path || "none"],
							],
						});
					}
				}

				for (const lane of postReviewLanes) {
					const tone = toneForLane(lane);
					const currentLane = issueIdentityKeys(lane)
						.map((key) => currentLaneByIssue.get(key))
						.find(Boolean);
					const shadowedByCurrentLane = lane.shadowed_by_current_lane === true;
					const issueKey = issueDisplayKey(lane);

					if (shadowedByCurrentLane) {
						const currentLaneFacts = currentLane
							? [
								["Run", currentLane.run_id],
								[
									"Operation",
									displayToken(currentLane.current_operation || currentLane.run_phase || currentLane.phase),
								],
							]
							: [["Run", "active"]];

						waitingItems.push({
							tone: "tone-run",
							scope: "Review",
							issue: issueKey,
							title: "Repair running",
							summary: "",
							status: currentLane
								? `run phase ${displayToken(currentLane.run_phase || currentLane.phase)}`
								: "current lane",
							facts: [
								...currentLaneFacts,
								["Checks", compactStateToken(lane.check_state)],
								["Threads", reviewThreadToken(lane.unresolved_review_threads)],
								["PR", optionalCardToken(lane.pr_url)],
								["Branch", optionalCardToken(lane.branch_name)],
								...loopStatusFacts(lane.loop_status),
								...postReviewReadbackFacts(lane),
							],
						});
						continue;
					}

					if (isPostReviewBlocker(lane)) {
						const blockerScope = postReviewBlockerScope(lane);
						if (blockerScope === "Cleanup") {
							cleanupIssueKeys.add(issueKey);
						}
						attentionItems.push({
							tone,
							scope: blockerScope,
							issue: issueKey,
							title: postReviewBlockerTitle(lane),
							summary: "",
							status: postReviewBlockerStatus(lane, blockerScope),
							facts: [
								["Checks", compactStateToken(lane.check_state)],
								["Threads", reviewThreadToken(lane.unresolved_review_threads)],
								["PR", optionalCardToken(lane.pr_url)],
								["Branch", optionalCardToken(lane.branch_name)],
								...loopStatusFacts(lane.loop_status),
								...postReviewReadbackFacts(lane),
							],
						});
						continue;
					}

					if (lane.classification === "wait_for_review") {
						waitingItems.push({
							tone,
							scope: "Review",
							issue: issueKey,
							title: "Wait for review",
							summary: "",
							status: lane.check_state ? `checks ${compactStateToken(lane.check_state)}` : "waiting",
							facts: [
								["Review decision", compactStateToken(lane.review_decision)],
								["Threads", reviewThreadToken(lane.unresolved_review_threads)],
								["PR", optionalCardToken(lane.pr_url)],
								["Branch", optionalCardToken(lane.branch_name)],
								...loopStatusFacts(lane.loop_status),
								...postReviewReadbackFacts(lane),
							],
						});
						continue;
					}

					if (lane.classification === "ready_to_land") {
						readyItems.push({
							tone,
							scope: "Review",
							issue: issueKey,
							title: "Ready to land",
							summary: "",
							status: lane.mergeable ? `merge ${compactStateToken(lane.mergeable)}` : "ready",
							facts: [
								["Review decision", compactStateToken(lane.review_decision)],
								["Checks", compactStateToken(lane.check_state)],
								["Threads", reviewThreadToken(lane.unresolved_review_threads)],
								["PR", optionalCardToken(lane.pr_url)],
								["Branch", optionalCardToken(lane.branch_name)],
								...loopStatusFacts(lane.loop_status),
								...postReviewReadbackFacts(lane),
							],
						});
					}
				}

				attentionItems.sort((left, right) => left.issue.localeCompare(right.issue));
				waitingItems.sort((left, right) => left.issue.localeCompare(right.issue));
				readyItems.sort((left, right) => left.issue.localeCompare(right.issue));
				const reviewWaitingCount = waitingItems.filter(
					(item) => item.scope === "Review",
				).length;
				const reviewBlockerCount = attentionItems.filter((item) =>
					["Review", "Closeout"].includes(item.scope),
				).length;
				const cleanupCount = cleanupIssueKeys.size;
				const runningAttentionCount = attentionItems.filter((item) => item.scope === "Running").length;
				const liveRuns = currentLanes.filter(runCountsAsRunning).length;
				const intakeAttentionCount = queueBacklogCandidates.filter(queuedCandidateNeedsAttention).length;
				const programAttentionCount = executionPrograms.filter((program) =>
					["attention", "blocked", "stale"].includes(program.status),
				).length;
				const programReadyCount = executionPrograms.reduce(
					(total, program) => total + Number(program.ready_count || 0),
					0,
				);
				const programDispatchableCount = executionPrograms.reduce(
					(total, program) => total + Number(program.dispatchable_count || 0),
					0,
				);

				return {
					projects: snapshot?.projects ?? [],
					currentLaneCards,
					liveRuns,
					currentLaneCount: currentLanes.length,
					liveLeases: currentLanes.filter((run) => run.run_lease).length,
					readyCount: readyItems.length,
					queuedCandidates,
					queueBacklogCandidates,
					queuedReady: queueBacklogCandidates.filter((candidate) => candidate.classification === "ready").length,
					queuedWaiting: queueBacklogCandidates.filter((candidate) => candidate.classification === "waiting").length,
					queuedActiveOwned: queuedCandidates.filter((candidate) => candidate.display_classification === "leased_run").length,
					queuedBlocked: queueBacklogCandidates.filter((candidate) => candidate.classification === "blocked").length,
					queuedBlockedWithoutAttention: queueBacklogCandidates.filter(
						(candidate) =>
							candidate.classification === "blocked" && !queuedCandidateNeedsAttention(candidate),
					).length,
					intakeAttentionCount,
					queuedClosed: staleClosedCandidates.length,
					reviewOwnedQueueCount,
					attentionItems,
					waitingItems,
					readyItems,
					reviewWaitingCount,
					reviewBlockerCount,
					cleanupCount,
					runningAttentionCount,
					executionPrograms,
					programAttentionCount,
					programReadyCount,
					programDispatchableCount,
					sessionHistoryRuns: historyRuns,
					worktrees,
					postReviewLanes,
				};
			}

			function renderHeader(snapshot, readiness, notices, snapshotPublishedAt, snapshotError) {
				nodes.projectTitle.textContent = "Decodex";
				document.title = snapshot
					? `${snapshot.project_id} · Decodex`
					: "Decodex";
				const snapshotFreshness = snapshotFreshnessMeta(
					snapshotPublishedAt,
					readiness,
					snapshotError,
				);
				const snapshotFreshnessRow = snapshotFreshness
					? `
						<span class="transport-meta" data-kind="snapshot" data-tone="${escapeHtml(snapshotFreshness.tone)}" title="${escapeHtml(snapshotFreshness.title)}">
							<span>Snapshot</span><strong>${escapeHtml(snapshotFreshness.label)}</strong>
						</span>
					`
					: "";
				const stream = dashboardStreamMeta();

				nodes.transportHealth.innerHTML = `
					<span class="status-pill ${readiness.tone}">${escapeHtml(topbarReadinessLabel(readiness.label))}</span>
					<span class="transport-meta" data-kind="endpoint" data-tone="${escapeHtml(stream.tone)}" title="${escapeHtml(stream.title)}">
						<span>Transport</span><strong>${renderValueLink("WebSocket", dashboardSocketUrl(), "transport-link") || escapeHtml(dashboardSocketUrl())}</strong>
					</span>
					${snapshotFreshnessRow}
				`;
				renderNoticeDock(notices);
			}

			function selectedProjectId(snapshot, projects) {
				if (snapshot?.project_id && snapshot.project_id !== "all") {
					return snapshot.project_id;
				}
				if (projects.length === 1 && projects[0].enabled) {
					return projects[0].project_id;
				}

				return null;
			}

			function projectHasActiveWork(project) {
				const workCount =
					(project.current_lane_count ?? 0) +
					(project.queued_candidate_count ?? 0) +
					(project.waiting_lane_count ?? 0) +
					(project.attention_count ?? 0) +
					(project.cleanup_blocked_count ?? 0) +
					(project.cleanup_pending_count ?? 0) +
					(project.post_review_lane_count ?? 0);

				return workCount > 0;
			}

			function projectRunningLaneCount(project) {
				return project.running_lane_count ?? project.current_lane_count ?? 0;
			}

			function activeProjects(projects) {
				return projects.filter(projectHasActiveWork);
			}

			function projectHealth(project) {
				if (!project.enabled) {
					return { label: "disabled", tone: "tone-muted", title: "Disabled in registry" };
				}
				if (projectRunningLaneCount(project) > 0) {
					return { label: "running", tone: "tone-run", title: "Active running lanes" };
				}
				if ((project.attention_count ?? 0) > 0) {
					return { label: "needs attention", tone: "tone-blocked", title: "Operator attention needed" };
				}
				if ((project.waiting_lane_count ?? 0) > 0) {
					return { label: "waiting", tone: "tone-wait", title: "Lanes waiting to resume" };
				}
				if ((project.cleanup_blocked_count ?? 0) > 0) {
					return { label: "cleanup blocked", tone: "tone-wait", title: "Post-land cleanup needs operator action" };
				}
				if ((project.cleanup_pending_count ?? 0) > 0) {
					return { label: "cleanup pending", tone: "tone-retained", title: "Post-land cleanup pending" };
				}
				if (project.connector_state === "backoff") {
					return {
						label: "sync backoff",
						tone: "tone-wait",
						title: "Tracker sync paused by rate limit.",
					};
				}
				if (project.connector_state === "config_error") {
					return {
						label: "config error",
						tone: "tone-wait",
						title: "Registered project config could not be loaded.",
					};
				}
				if (
					(project.warning_count ?? 0) > 0 ||
					["degraded", "stale_cache"].includes(project.connector_state)
				) {
					return { label: "sync degraded", tone: "tone-muted", title: "Tracker sync or retry state degraded" };
				}

				return { label: "ok", tone: "tone-ready", title: "No project warnings" };
			}

			function projectCapacitySummary(project) {
				const cleanup = (project.cleanup_blocked_count ?? 0) + (project.cleanup_pending_count ?? 0);

				return [
					`${projectRunningLaneCount(project)} running`,
					`${project.waiting_lane_count ?? 0} waiting`,
					`${project.attention_count ?? 0} attention`,
					`${cleanup} cleanup`,
				].join(" · ");
			}

			function projectKicker(project) {
				if (!project.enabled) {
					return "Disabled";
				}

				return "";
			}

			function renderProjectStats(project) {
				const running = projectRunningLaneCount(project);
				const waiting = project.waiting_lane_count ?? 0;
				const attention = project.attention_count ?? 0;
				const cleanup = (project.cleanup_blocked_count ?? 0) + (project.cleanup_pending_count ?? 0);

				return `
					<span class="project-work-ratio" role="cell" aria-label="${escapeHtml(`${running} running, ${waiting} waiting, ${attention} attention, ${cleanup} cleanup`)}" title="running / waiting / attention / cleanup">
						<strong>${escapeHtml(running)}</strong><span class="project-work-separator">/</span><strong>${escapeHtml(waiting)}</strong><span class="project-work-separator">/</span><strong>${escapeHtml(attention)}</strong><span class="project-work-separator">/</span><strong>${escapeHtml(cleanup)}</strong>
					</span>
				`;
			}

			function projectAttentionSummary(project) {
				if (!project.enabled) {
					return "disabled";
				}
				if ((project.attention_count ?? 0) > 0) {
					return `${project.attention_count} attention`;
				}
				if ((project.cleanup_blocked_count ?? 0) > 0) {
					return `${project.cleanup_blocked_count} cleanup blocked`;
				}
				if ((project.cleanup_pending_count ?? 0) > 0) {
					return `${project.cleanup_pending_count} cleanup pending`;
				}
				if (project.connector_state === "config_error") {
					return "config error";
				}
				if ((project.warning_count ?? 0) > 0) {
					return pluralize(project.warning_count, "warning");
				}
				if ((project.retained_worktree_count ?? 0) > 0) {
					return `${pluralize(project.retained_worktree_count, "worktree")} retained`;
				}

				return "ok";
			}

			function projectConnectorSummary(project) {
				if (!project.enabled || project.connector_state === "disabled") {
					return "disabled";
				}
				if (project.connector_state === "backoff") {
					return "backoff";
				}
				if (project.connector_state === "stale_cache") {
					return "stale";
				}
				if (project.connector_state === "degraded") {
					return "degraded";
				}
				if (project.connector_state === "config_error") {
					return "config error";
				}

				return "ok";
			}

			function projectPathSummary(project) {
				return project.repo_root || project.config_path || "path unavailable";
			}

			function compactProjectLocation(projectPath) {
				return String(projectPath || "").replace(/^\/Users\/[^/]+/, "~");
			}

			function projectLocationText(projectPath) {
				return projectLocationsHidden ? "-" : compactProjectLocation(projectPath);
			}

			function projectLocationMarkup(projectPath) {
				const projectLocation = projectLocationText(projectPath);
				if (projectLocationsHidden || projectLocation === "-") {
					return `<span class="project-path-tail">-</span>`;
				}

				const slashIndex = projectLocation.lastIndexOf("/");
				if (slashIndex <= 0) {
					return `<span class="project-path-tail">${escapeHtml(projectLocation)}</span>`;
				}

				return `
					<span class="project-path-prefix">${escapeHtml(projectLocation.slice(0, slashIndex + 1))}</span>
					<span class="project-path-tail">${escapeHtml(projectLocation.slice(slashIndex + 1))}</span>
				`;
			}

			function projectWorkInfoMarkup() {
				return `
					<span class="project-work-info-wrap">
						<button class="project-work-info" type="button" data-project-work-info aria-expanded="false" aria-label="Work format: running / waiting / attention / cleanup">
							<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
								<circle cx="8" cy="8" r="6"></circle>
								<path d="M8 7.3v3.8"></path>
								<path d="M8 4.8h.01"></path>
							</svg>
						</button>
						<span class="project-work-tooltip" role="tooltip">running / waiting / attention / cleanup</span>
					</span>
				`;
			}

			function renderProjectSortButton([key, label]) {
				const direction = projectSort.key === key ? projectSort.direction : "";
				const activeClass = direction ? ` is-active is-${direction}` : "";
				const current = direction
					? `currently ${direction === "asc" ? "ascending" : "descending"}`
					: "not sorted";

				return `
					<button class="project-table-sort${activeClass}" type="button" data-project-sort-key="${escapeHtml(key)}" aria-label="Sort projects by ${escapeHtml(label)}; ${escapeHtml(current)}" title="Sort by ${escapeHtml(label)}">
						<span class="project-table-sort-label">${escapeHtml(label)}</span>

			function renderProjectColumnHead(column, options = {}) {

			const projectRegistrationCommand =
				"decodex project add ~/.codex/decodex/projects/<service-id>";

			function renderProjectEmptyState(title, copy, options = {}) {

			function renderProjectEntry(project, selectedId) {
				const health = projectHealth(project);
				const isActive = selectedId === project.project_id;
				const projectPath = projectPathSummary(project);
				const projectLocationTitle = projectLocationsHidden ? "Project location hidden" : projectPath;
				const kicker = projectKicker(project);
				const lastActivity = formatRelativeTimestamp(project.last_activity_at);
				const activityCopy = lastActivity === "none" ? "-" : lastActivity;
				const ariaCurrent = isActive ? ' aria-current="true"' : "";

				return `
					<article class="project-entry ${health.tone}${isActive ? " is-active" : ""}" role="row"${ariaCurrent} aria-label="Project ${escapeHtml(project.project_id)} ${escapeHtml(health.label)} ${escapeHtml(projectCapacitySummary(project))}">
						<div class="project-entry-main" role="cell">
							<div class="project-title-line">
								<strong>${escapeHtml(project.project_id)}</strong>
								${kicker ? `<span class="project-kicker">${escapeHtml(kicker)}</span>` : ""}
							</div>
						</div>
						<div class="project-path" role="cell" title="${escapeHtml(projectLocationTitle)}">${projectLocationMarkup(projectPath)}</div>
						<span class="project-activity" role="cell">${escapeHtml(activityCopy)}</span>
						<div class="project-stat-line" aria-label="Project status summary">
							${renderProjectStats(project)}
						</div>
					</article>
				`;

			function projectFilterRows(projects, activeProjectRows) {
				return projectFilterMode === "all" ? projects : activeProjectRows;
			}

			function projectNumber(value) {
				const number = Number(value ?? 0);
				return Number.isFinite(number) ? number : 0;
			}

			function projectTimestampSortValue(value) {
				if (!value) {
					return null;
				}

				const parsed = new Date(value);
				const time = parsed.getTime();
				return Number.isNaN(time) ? null : time;
			}

			function projectWorkSortValue(project) {
				return [
					projectNumber(projectRunningLaneCount(project)),
					projectNumber(project.waiting_lane_count),
					projectNumber(project.attention_count),
					projectNumber(project.cleanup_blocked_count),
					projectNumber(project.cleanup_pending_count),
				];
			}

			function projectColumnSortValue(project, key) {
				if (key === "project") {
					return String(project.project_id || "").toLowerCase();
				}
				if (key === "location") {
					return compactProjectLocation(projectPathSummary(project)).toLowerCase();
				}
				if (key === "activity") {
					return projectTimestampSortValue(project.last_activity_at);
				}
				if (key === "work") {
					return projectWorkSortValue(project);
				}

				return "";
			}

			function compareProjectSortValues(leftValue, rightValue, direction) {
				const leftMissing = leftValue == null || leftValue === "";
				const rightMissing = rightValue == null || rightValue === "";
				if (leftMissing && rightMissing) {
					return 0;
				}
				if (leftMissing) {
					return 1;
				}
				if (rightMissing) {
					return -1;
				}

				if (Array.isArray(leftValue) && Array.isArray(rightValue)) {
					const count = Math.max(leftValue.length, rightValue.length);
					for (let index = 0; index < count; index += 1) {
						const delta = compareProjectSortValues(
							leftValue[index] ?? 0,
							rightValue[index] ?? 0,
							direction,
						);
						if (delta) {
							return delta;
						}
					}

					return 0;
				}

				const delta =
					typeof leftValue === "number" && typeof rightValue === "number"
						? leftValue === rightValue
							? 0
							: leftValue < rightValue
								? -1
								: 1
						: String(leftValue).localeCompare(String(rightValue));

				return direction === "desc" ? -delta : delta;
			}

			function compareProjectRowsByColumn(left, right, key, direction) {
				return compareProjectSortValues(
					projectColumnSortValue(left, key),
					projectColumnSortValue(right, key),
					direction,
				);
			}

			function projectOperationalRank(project) {
				if (!project.enabled) {
					return 5;
				}
				if (projectRunningLaneCount(project) > 0) {
					return 0;
				}
				if ((project.attention_count ?? 0) > 0) {
					return 1;
				}
				if ((project.waiting_lane_count ?? 0) > 0) {
					return 2;
				}
				if ((project.cleanup_blocked_count ?? 0) > 0) {
					return 3;
				}
				if ((project.cleanup_pending_count ?? 0) > 0) {
					return 4;
				}
				if (projectHasActiveWork(project)) {
					return 5;
				}
				if (["backoff", "config_error", "degraded", "stale_cache"].includes(project.connector_state)) {
					return 6;
				}
				if ((project.warning_count ?? 0) > 0) {
					return 7;
				}

				return 8;
			}

			function compareProjectRowsStable(left, right) {
				const rankDelta = projectOperationalRank(left) - projectOperationalRank(right);
				if (rankDelta) {
					return rankDelta;
				}

				return String(left.project_id || "").localeCompare(String(right.project_id || ""));
			}

			function sortProjectRows(rows) {
				return [...rows].sort((left, right) => {
					if (projectSort.key) {
						const columnDelta = compareProjectRowsByColumn(
							left,
							right,
							projectSort.key,
							projectSort.direction,
						);
						if (columnDelta) {
							return columnDelta;
						}
					}

					return compareProjectRowsStable(left, right);
				});
			}

			function renderProjectTable(projects, activeProjectRows, selectedId) {
				const rows = sortProjectRows(projectFilterRows(projects, activeProjectRows));
				const label = projectFilterMode === "all" ? "All projects" : "Active projects";

				if (!rows.length) {
					return "";
				}

				return `
					<div class="project-table" role="table" aria-label="${escapeHtml(label)}">
						<div class="project-table-guide" role="row">
							${renderProjectColumnHead(PROJECT_SORT_COLUMNS[0])}
							${renderProjectColumnHead(PROJECT_SORT_COLUMNS[1], {
								className: "project-location-head",
								after: projectLocationToggleMarkup(),
							})}
							${renderProjectColumnHead(PROJECT_SORT_COLUMNS[2])}
							${renderProjectColumnHead(PROJECT_SORT_COLUMNS[3], {
								after: projectWorkInfoMarkup(),
							})}
						</div>
						<div class="project-table-list" role="rowgroup">
							${rows.map((project) => renderProjectEntry(project, selectedId)).join("")}
						</div>
					</div>
				`;
			}

			function renderProjects(snapshot, derived) {
				if (!snapshot) {
					renderProjectFilterToggle();
					nodes.projectOverview.classList.add("is-empty", "is-waiting");
					nodes.projectOverview.innerHTML = "";
					return;
				}

				const projects = derived.projects;
				const activeProjectRows = activeProjects(projects);

				if (!projects.length) {
					renderProjectFilterToggle(projects);
					nodes.projectOverview.classList.add("is-empty");
					nodes.projectOverview.classList.remove("has-registered-projects");
					nodes.projectOverview.classList.remove("is-waiting");
					nodes.projectOverview.innerHTML = renderProjectEmptyState(
						"No projects",
						"Register projects explicitly; Decodex does not scan history or repos.",
					);
					return;
				}

				const selectedId = selectedProjectId(snapshot, projects);
				const visibleProjectRows = projectFilterRows(projects, activeProjectRows);

				renderProjectFilterToggle(projects);
				nodes.projectOverview.classList.remove("is-empty", "is-waiting");
				nodes.projectOverview.classList.toggle("is-empty", visibleProjectRows.length === 0);
				nodes.projectOverview.classList.toggle("has-registered-projects", visibleProjectRows.length > 0);
				nodes.projectOverview.innerHTML = renderProjectTable(projects, activeProjectRows, selectedId);
				renderProjectLocationToggle();
				renderProjectWorkInfoState();
			}

			function setFlowCounts(queue, run, review, land) {
				setMetricText(nodes.flowCounts.queue, queue);
				setMetricText(nodes.flowCounts.run, run);
				setMetricText(nodes.flowCounts.review, review);
				setMetricText(nodes.flowCounts.land, land);
			}

			function setFlowActivity(activity) {
				for (const label of nodes.flowStepLabels) {
					label.classList.toggle("active", Boolean(activity[label.dataset.flowStep]));
				}
			}

			function renderFlow(snapshot, derived) {
				if (!snapshot) {
					setFlowCounts("0 issues", "0 lanes", "0 PRs", "0 PRs");
					setFlowActivity({});
					return;
				}

				const retainedCount = (snapshot.post_review_lanes ?? []).length;
				setFlowCounts(
					pluralize(derived.queueBacklogCandidates.length, "issue"),
					pluralize(derived.currentLaneCount, "lane"),
					pluralize(retainedCount, "PR"),
					pluralize(derived.readyCount, "PR"),
				);
				setFlowActivity({
					queue: derived.queueBacklogCandidates.length > 0,
					run: derived.currentLaneCount > 0,
					review:
						derived.reviewBlockerCount > 0 ||
						derived.reviewWaitingCount > 0 ||
						derived.postReviewLanes.length > 0,
					land: derived.readyCount > 0,
				});
			}

			function runningLaneMetaText(derived) {
				const parts = [`${derived.liveRuns ?? 0} running`];
				const attentionCount = derived.runningAttentionCount;

				if (attentionCount) {
					parts.push(
						attentionCount === 1
							? "1 needs attention"
							: `${attentionCount} need attention`,
					);
				}

				return parts.join(" · ");
			}

			function backlogMetaText(snapshot, derived) {
				if (!snapshot) {
					return "0 queued";
				}

				const parts = [`${derived.queueBacklogCandidates.length} queued`];

				if (derived.queuedReady) {
					parts.push(`${derived.queuedReady} ready`);
				}
				if (derived.queuedWaiting) {
					parts.push(`${derived.queuedWaiting} waiting`);
				}
				if (derived.queuedBlocked) {
					parts.push(`${derived.queuedBlocked} blocked`);
				}
				if (derived.queuedActiveOwned) {
					parts.push(
						pluralize(
							derived.queuedActiveOwned,
							COPY.runningInlineMeta,
							COPY.runningInlineMetaPlural,
						),
					);
				}
				if (derived.queuedClosed) {
					parts.push(`${derived.queuedClosed} ${COPY.staleClosed}`);
				}
				if (derived.reviewOwnedQueueCount) {
					parts.push(`${derived.reviewOwnedQueueCount} in review`);
				}

				return parts.join(" · ");
			}

			function programMetaText(snapshot, derived) {
				if (!snapshot) {
					return "0 programs";
				}

				const parts = [pluralize(derived.executionPrograms.length, "program")];

				if (derived.programReadyCount) {
					parts.push(`${derived.programReadyCount} ready`);
				}
				if (derived.programDispatchableCount) {
					parts.push(`${derived.programDispatchableCount} dispatchable`);
				}
				if (derived.programAttentionCount) {
					parts.push(
						derived.programAttentionCount === 1
							? "1 needs attention"
							: `${derived.programAttentionCount} need attention`,
					);
				}

				return parts.join(" · ");
			}

			function toneForProgram(program) {
				switch (program.status) {
					case "ready":
					case "completed":
						return "tone-ready";
					case "queued":
						return "tone-queue";
					case "active":
						return "tone-run";
					case "blocked":
					case "attention":
					case "stale":
						return "tone-blocked";
					case "held":
						return "tone-wait";
					default:
						return "tone-muted";
				}
			}

			function programMappedIssues(program) {
				const issues = program.mapped_issue_identifiers ?? [];

				return issues.length ? issues.join(", ") : "NONE";
			}

			function programProgressFacts(program) {
				return [
					["Ready", String(program.ready_count ?? 0)],
					["Queued", String(program.queued_count ?? 0)],
					["Dispatchable", String(program.dispatchable_count ?? 0)],
					["Active", String(program.active_count ?? 0)],
					["Blocked", String(program.blocked_count ?? 0)],
					["Held", String(program.held_count ?? 0)],
					["Attention", String(program.needs_attention_count ?? 0)],
					["Completed", String(program.completed_count ?? 0)],
					["Stale", String(program.stale_count ?? 0)],
				];
			}

			function programNodeReasons(node) {
				const reasons = node.reasons ?? [];
				if (reasons.length) {
					return reasons.join("; ");
				}

				const reasonCodes = node.reason_codes ?? [];
				return reasonCodes.length ? reasonCodes.map(displayToken).join(", ") : "none";
			}

			function programNodeIssue(node) {
				return node.issue_identifier || "unmapped";
			}

			function renderProgramNodeReadbacks(program) {
				const readbacks = program.node_readbacks ?? [];
				if (!readbacks.length) {
					return "";
				}

				const detailKey = `program:${program.program_id}:nodes`;

				return `
					<details data-detail-key="${escapeHtml(detailKey)}"${detailsOpenAttribute(detailKey)}>
						<summary>${escapeHtml(pluralize(readbacks.length, "node diagnostic"))}</summary>
						<div class="grid debug-grid">
							${readbacks
								.map((node) => {
									const reasonCodes = (node.reason_codes ?? []).map(displayToken).join(", ") || "none";
									return `
										${field("Issue", programNodeIssue(node))}
										${field("Program stage", displayToken(node.program_stage || "unknown"))}
										${field("Lifecycle", displayToken(node.lifecycle_state || "unknown"))}
										${field("Readiness", displayToken(node.readiness_state || "unknown"))}
										${field("Issue state", node.issue_state || "none")}
										${field("Dispatch action", node.dispatch_action || "none")}
										${field("Reason codes", reasonCodes)}
										${field("Reasons", programNodeReasons(node))}
										${field("Next action", node.next_action || "none")}
									`;
								})
								.join("")}
						</div>
					</details>
				`;
			}

			function renderExecutionPrograms(snapshot, derived) {
				const programs = derived.executionPrograms ?? [];
				setPanelMeta(
					nodes.programsMeta,
					programMetaText(snapshot, derived),
					derived.programAttentionCount ? "attention" : "",
				);

				if (!programs.length) {
					renderRoutineEmptyList(nodes.executionPrograms);
					return;
				}

				renderStableList(
					nodes.executionPrograms,
					programs
						.map((program) => {
							const tone = toneForProgram(program);
							const mappedIssues = programMappedIssues(program);
							const warning = program.readback_warning
								? inlineStatusFact("Warning", displayToken(program.readback_warning))
								: "";
							return `
								<article class="action-card ${tone}" data-render-key="program:${escapeHtml(program.program_id)}">
									<div class="row-head">
										<div class="row-title">
											<div class="kicker">
												<span>${escapeHtml(displayToken(program.intake_kind || "program"))}</span>
												<span class="mono">${escapeHtml(program.program_id)}</span>
											</div>
											<h4>${escapeHtml(program.public_summary || program.program_id)}</h4>
										</div>
									</div>
									<div class="status-line">
										${statusLabel(displayToken(program.status || "unknown"), tone)}
										${inlineStatusFact("Dispatchable", String(program.dispatchable_count ?? 0))}
										${warning}
									</div>
									<div class="grid two card-facts">
										${cardField("Mapped issues", mappedIssues, mappedIssues === "NONE" ? "is-muted" : "")}
										${cardField("Source contract", program.source_contract_id || "NONE", program.source_contract_id ? "" : "is-muted")}
										${programProgressFacts(program)
											.map(([label, value]) => cardField(label, value))
											.join("")}
									</div>
									${renderProgramNodeReadbacks(program)}
								</article>
							`;
						})
						.join(""),
				);
			}

			function renderQueuedCandidates(container, items) {
				if (!items.length) {
					renderRoutineEmptyList(container);
					return;
				}

				container.innerHTML = items
					.map((candidate) => {

							: "NONE";
						const summary = summarizeQueuedCandidate(candidate);
						const reason = queuedCandidateInlineReason(candidate);

						return `
							<article class="action-card ${tone}">
								<div class="row-head">
									<div class="row-title">
										<div class="kicker">
											<span>Issue</span>
											<span class="mono">${escapeHtml(candidate.issue_identifier)}</span>
										</div>
										<h4>${escapeHtml(candidate.title)}</h4>
									</div>
								</div>
								${summary ? `<p class="row-summary">${escapeHtml(summary)}</p>` : ""}
								<div class="status-line">
									${statusLabel(queuedCandidateStatusText(candidate), tone)}
									${reason ? inlineStatusFact("Reason", reason) : ""}
								</div>
								${renderAttentionFacts(candidate)}
								<div class="grid two card-facts">
									${cardField("State", formatDetailToken(candidate.state))}
									${cardField("Priority", formatPriority(candidate.priority))}
									${cardField("Created", formatTimestampCompact(candidate.created_at), "is-time")}
									${cardField("Blockers", blockers, blockers === "NONE" ? "is-muted" : "")}

			function renderActionCards(container, items) {
				if (!items.length) {
					renderRoutineEmptyList(container);
					return;
				}

				container.innerHTML = items
					.map(
						(item) => `
							<article class="action-card ${item.tone}">
								<div class="row-head">
									<div class="row-title">
										<div class="kicker">
											<span>${escapeHtml(item.scope)}</span>
											<span class="mono">${escapeHtml(item.issue)}</span>
										</div>
										<h4>${escapeHtml(item.title)}</h4>
									</div>
								</div>
								${item.summary ? `<p class="row-summary">${escapeHtml(item.summary)}</p>` : ""}
								<div class="status-line">
									${statusLabel(item.status, item.tone)}
								</div>
								<div class="grid two card-facts">
									${item.facts.map(([label, value, valueClass]) => cardField(label, value, cardFactValueClass(value, valueClass))).join("")}
								</div>
							</article>
						`,
					)
					.join("");
			}

			function reviewLaneItems(derived) {
				const rankedItems = [
					...derived.attentionItems
						.filter((item) => ["Review", "Closeout", "Cleanup"].includes(item.scope))
						.map((item) => ({ ...item, sortRank: 0 })),
					...derived.readyItems.map((item) => ({ ...item, sortRank: 1 })),
					...derived.waitingItems
						.filter((item) => item.scope === "Review")
						.map((item) => ({ ...item, sortRank: 2 })),
				];

				return rankedItems.sort(
					(left, right) => left.sortRank - right.sortRank || left.issue.localeCompare(right.issue),
				);
			}

			function renderCurrentLanes(snapshot, derived) {
				const cards = derived.currentLaneCards ?? snapshotCurrentLaneCards(snapshot);
				setPanelMeta(
					nodes.currentLanesMeta,
					runningLaneMetaText(derived),
					derived.runningAttentionCount ? "attention" : "",
				);

				if (!cards.length) {
					renderRoutineEmptyList(nodes.currentLanes);
					return;
				}

				renderStableList(
					nodes.currentLanes,
					cards
						.map((card, index) => {
							const run = card.run || {};
							const tone = currentLaneCardToneClass(card);
							const statusBits = [statusLabel(runPhaseLabel(run), tone)];
							const detailKey = runDetailKey(run);
							const renderKey = card.id || card.run_id || `presentation-card:${index}`;
							const issueKey = card.issue_identifier || "unknown";
							const issueTitle = card.title || "Run";
							const summary = currentLaneVisibleSummary(card, run);
							if (run.ownership_state && run.ownership_state !== "leased_run") {
								statusBits.push(inlineStatusFact("Owner", displayToken(run.ownership_state)));
							}
							if (run.policy_state && !["allowed", "review_findings", "review_pending"].includes(run.policy_state)) {
								statusBits.push(inlineStatusFact("Policy", displayToken(run.policy_state)));
							}

							if (run.wait_reason && !runWaitReasonShowsExecutionProgress(run)) {
								const waitReason = displayToken(run.wait_reason);
								if (!displayTextRepeats(summary, waitReason)) {
									statusBits.push(inlineStatusFact("Wait", waitReason));
								}
							}
							if (runTelemetryMissing(run)) {
								const telemetryFact = runHasChildAgentActivity(run)
									? ["Metadata", "Pending"]
									: ["Telemetry", "Missing"];
								if (!displayTextRepeats(summary, telemetryFact.join(" "))) {
									statusBits.push(inlineStatusFact(telemetryFact[0], telemetryFact[1]));
								}
							}
							if (
								!runStoppedProcessNeedsAttention(run) &&
								runProcessStoppedWhileActive(run)
							) {
								statusBits.push(inlineStatusFact("Agent", "Done"));
							}
							if (run.interactive_requested && !runStoppedProcessNeedsAttention(run)) {
								if (!displayTextRepeats(summary, "operator input")) {
									statusBits.push(inlineStatusFact("Operator", "Input"));
								}
							}
							if (run.continuation_pending) {
								if (!displayTextRepeats(summary, "continuation pending")) {
									statusBits.push(inlineStatusFact("Continuation", "Pending"));
								}
							}
							const loopInline = loopStatusInline(run.loop_status);
							if (loopInline && !displayTextRepeats(summary, loopInline)) {
								statusBits.push(inlineStatusFact("Loop", loopInline));
							}
							const attemptNumber = attemptNumberFromRun(run);
							return `
							<article class="run-card ${tone}" data-render-key="${escapeHtml(renderKey)}">

			function worktreeRoleMeta(worktree, snapshot) {
				const hygiene = worktree.hygiene;
				const currentLaneMatch = snapshotCurrentLaneRuns(snapshot).find(
					(run) =>
						(run.worktree_path === worktree.worktree_path ||
							run.branch_name === worktree.branch_name ||
							run.issue_id === worktree.issue_id),
				);
				const reviewMatch = (snapshot?.post_review_lanes ?? []).find(
					(lane) =>
						lane.worktree_path === worktree.worktree_path ||
						lane.branch_name === worktree.branch_name ||
						lane.issue_id === worktree.issue_id ||
						lane.issue_identifier === worktree.issue_id,
				);

				if (currentLaneMatch) {
					return {
						sortRank: 0,
						tone: "tone-run",
						label: "current lane",
						summary: worktree.ownership_reason || "Leased by a running lane.",
					};
				}
				if (reviewMatch) {
					if (hygiene) {
						const isDirty = hygiene.classification === "merged_dirty_worktree" || hygiene.dirty === true;

						return {
							sortRank: 1,
							tone: isDirty ? "tone-wait" : "tone-retained",
							label: isDirty ? "post-review cleanup blocked" : "post-review cleanup",
							summary:
								hygiene.reason ||
								worktree.ownership_reason ||
								"Post-review cleanup pending.",
						};
					}

					return {
						sortRank: 1,
						tone: toneForLane(reviewMatch),
						label: `post-review ${displayToken(reviewMatch.classification)}`,
						summary:
							worktree.ownership_reason ||
							"Retained for review, landing, or closeout.",
					};
				}
				const queueMatch = (snapshot?.queued_candidates ?? []).find((candidate) => {
					const attentionWorktree = candidate.attention?.worktree_path;

					return (
						(candidate.reason === "issue_needs_attention" ||
							candidate.reason === "linear_active_label_present") &&
						(attentionWorktree === worktree.worktree_path ||
							candidate.issue_id === worktree.issue_id ||
							candidate.issue_identifier === worktree.issue_id)
					);
				});

				if (queueMatch) {
					return {
						sortRank: 0,
						tone: "tone-blocked",
						label: "queued attention",
						summary:
							worktree.ownership_reason ||
							"Owned by Intake Queue attention; recover there before cleanup.",
					};
				}
				if (worktree.ownership === "current_lane") {
					return {
						sortRank: 0,
						tone: "tone-run",
						label: "current lane",
						summary: worktree.ownership_reason || "Leased by a running lane.",
					};
				}
				if (worktree.ownership === "queued_attention") {
					return {
						sortRank: 0,
						tone: "tone-blocked",
						label: "queued attention",
						summary:
							worktree.ownership_reason ||
							"Owned by Intake Queue attention; recover there before cleanup.",
					};
				}
				if (worktree.ownership === "post_review_lane") {
					if (hygiene) {
						const isDirty = hygiene.classification === "merged_dirty_worktree" || hygiene.dirty === true;

						return {
							sortRank: 1,
							tone: isDirty ? "tone-wait" : "tone-retained",
							label: isDirty ? "post-review cleanup blocked" : "post-review cleanup",
							summary:
								hygiene.reason ||
								worktree.ownership_reason ||
								"Post-review cleanup pending.",
						};
					}

					return {
						sortRank: 1,
						tone: "tone-retained",
						label: "post-review retained",
						summary:
							worktree.ownership_reason ||
							"Retained for review, landing, or closeout.",
					};
				}
				if (hygiene) {
					const isDirty = hygiene.classification === "merged_dirty_worktree" || hygiene.dirty === true;

					return {
						sortRank: 2,
						tone: isDirty ? "tone-wait" : "tone-retained",
						label: isDirty ? "post-land cleanup blocked" : "post-land cleanup",
						summary:
							hygiene.reason ||
							worktree.ownership_reason ||
							"Post-land cleanup pending.",
					};
				}
				if (worktree.ownership === "post_land_cleanup") {
					return {
						sortRank: 2,
						tone: "tone-retained",
						label: "post-land cleanup",
						summary:
							worktree.ownership_reason ||
							"Post-land cleanup pending.",
					};
				}
				if (worktree.provenance?.audit_required) {
					return {
						sortRank: 2,
						tone: "tone-blocked",
						label: "legacy cleanup audit",
						summary:
							worktree.ownership_reason ||
							"Legacy worktree provenance is missing; verify terminal state before cleanup.",
					};
				}
				return {
					sortRank: 2,
					tone: "tone-recovery",
					label: "local cleanup",
					summary:
						worktree.ownership_reason ||
						"No lane owns this worktree; inspect before cleanup.",
				};
			}

			function renderWorktreeHygieneFields(worktree) {
				const hygiene = worktree.hygiene;
				if (!hygiene) {
					return "";
				}

				return `
					${field("Cleanup state", displayToken(hygiene.classification || "cleanup_pending"))}
					${field("Default branch", hygiene.default_branch || "unknown")}
					${field("Uncommitted changes", hygiene.dirty ? "yes" : "no")}
				`;
			}

			function renderWorktreeProvenanceFields(worktree) {
				const provenance = worktree.provenance;
				if (!provenance) {
					return "";
				}

				const createdAt = unixEpochSecondsToIso(provenance.created_at_unix) || "unknown";
				const updatedAt = unixEpochSecondsToIso(provenance.updated_at_unix) || "unknown";
				const audit = provenance.audit_required ? field("Audit", "required") : "";
				const nextAction = worktree.recovery_next_action
					? field("Next action", worktree.recovery_next_action)
					: "";

				return `
					${field("Provenance", displayToken(provenance.source || "unknown"))}
					${field("Recorded", createdAt)}
					${field("Refreshed", updatedAt)}
					${audit}
					${nextAction}
				`;
			}

			function recoveryWorktreeShouldDefaultOpen(renderedWorktree) {
				const role = renderedWorktree.role;

				return role.tone === "tone-blocked";
			}

			function renderWorktrees(snapshot) {
				const worktrees = snapshot?.worktrees ?? [];
				const renderedWorktrees = worktrees
					.map((worktree) => ({ worktree, role: worktreeRoleMeta(worktree, snapshot) }))
					.sort((left, right) => {
						const rankDelta = left.role.sortRank - right.role.sortRank;
						if (rankDelta) {
							return rankDelta;
						}
						return (
							String(left.worktree.issue_id).localeCompare(String(right.worktree.issue_id)) ||
							String(left.worktree.branch_name).localeCompare(String(right.worktree.branch_name)) ||
							String(left.worktree.worktree_path).localeCompare(String(right.worktree.worktree_path))
						);
					});
				const retainedWorktrees = renderedWorktrees.filter(({ role }) => role.sortRank > 0);
				setFoldPanelEmpty(nodes.panels.worktrees, !retainedWorktrees.length);
				syncDefaultDetailOpenState(
					nodes.panels.worktrees,
					retainedWorktrees.some(recoveryWorktreeShouldDefaultOpen),
				);

				setPanelMeta(
					nodes.worktreesMeta,
					retainedWorktrees.length
						? pluralize(retainedWorktrees.length, "worktree")
						: "0 worktrees",
				);

				if (!retainedWorktrees.length) {
					nodes.worktrees.innerHTML = "";
					return;
				}

				nodes.worktrees.innerHTML = retainedWorktrees
					.map(({ worktree, role }) => {
						const issueKey = issueDisplayKey(worktree);

						return `
							<article class="worktree-card ${role.tone}">
								<div class="row-head">
									<div class="row-title">
										<div class="kicker">
											<span>Issue</span>
											<span class="mono">${escapeHtml(issueKey)}</span>
										</div>
										<h4>${escapeHtml(worktree.branch_name)}</h4>
									</div>
								</div>
								<div class="status-line">
									${statusLabel(role.label, role.tone)}
								</div>
								<p class="row-summary">${escapeHtml(role.summary)}</p>
								<div class="grid two">
									${field("Issue state", worktree.issue_state || "unknown")}
									${field("Ownership", displayToken(worktree.ownership || role.label))}
									${field("Branch", worktree.branch_name)}
									${field("Worktree path", worktree.worktree_path)}
									${renderWorktreeProvenanceFields(worktree)}
									${renderWorktreeHygieneFields(worktree)}
								</div>
							</article>
						`;
					})
					.join("");
			}

			function unixEpochSeconds(value) {
				const unixEpochSeconds = Number(value);
				if (!Number.isFinite(unixEpochSeconds)) {
					return null;
				}

				return unixEpochSeconds;
			}

			function unixEpochSecondsToIso(value) {
				const seconds = unixEpochSeconds(value);
				if (seconds == null) {
					return null;
				}

				const parsed = new Date(seconds * 1000);
				if (Number.isNaN(parsed.getTime())) {
					return null;
				}

				return parsed.toISOString();
			}

			function isoTimestampUnixEpoch(value) {
				const timestamp = Date.parse(value || "");
				if (!Number.isFinite(timestamp)) {
					return null;
				}

				return Math.floor(timestamp / 1000);
			}

			function parseDashboardSocketMessage(message) {
				try {
					return JSON.parse(message.data);
				} catch (_error) {
					return null;
				}
			}

			function updateDashboardStreamState(patch, shouldRender = true) {
				dashboardStreamState = {
					...dashboardStreamState,
					...patch,
				};

				if (shouldRender && lastDashboardRender) {
					renderDashboardState(lastDashboardRender);
				}
			}

			function scheduleDashboardSocketReconnect() {
				if (dashboardSocketReconnectTimer) {
					return;
				}

				dashboardSocketReconnectTimer = window.setTimeout(() => {
					dashboardSocketReconnectTimer = null;
					connectDashboardSocket();
				}, 2000);
			}

			function renderDashboardLocalClockTick() {
				if (document.hidden || !lastDashboardRender) {
					return;
				}

				refreshAccountApiSnapshot();
				renderDashboardState(lastDashboardRender, { refreshAccounts: false });
			}

			function startDashboardLocalClock() {
				if (dashboardLocalClockTimer) {
					return;
				}

				dashboardLocalClockTimer = window.setInterval(
					renderDashboardLocalClockTick,
					DASHBOARD_LOCAL_CLOCK_INTERVAL_MS,
				);
			}

			function presentationCurrentLaneCards(presentation) {
				return Array.isArray(presentation?.current_lane_cards)
					? presentation.current_lane_cards.filter((card) => card && typeof card === "object")
					: [];
			}

			function snapshotCurrentLaneCards(snapshot) {
				return presentationCurrentLaneCards(snapshot?.presentation);
			}

			function currentLaneRunsFromCards(cards) {
				return cards
					.map((card) => card?.run)
					.filter((run) => run && typeof run === "object");
			}

			function snapshotCurrentLaneRuns(snapshot) {
				return currentLaneRunsFromCards(snapshotCurrentLaneCards(snapshot));
			}

			function currentLaneCardToneClass(card) {
				const run = card?.run || {};
				if (card?.needs_attention === true || card?.tone === "attention") {
					return "tone-blocked";
				}
				if (card?.is_waiting === true || card?.tone === "waiting") {
					return "tone-wait";
				}
				if (card?.counts_as_running === true || runCountsAsRunning(run)) {
					return "tone-run";
				}

				return toneForRun(run);
			}

			function dashboardRunActivityIsStale(payload) {
				const emittedAt = unixEpochSeconds(payload?.emittedAtUnixEpoch);
				const snapshotPublishedAt = isoTimestampUnixEpoch(lastDashboardRender?.snapshotPublishedAt);

				return emittedAt != null && snapshotPublishedAt != null && emittedAt < snapshotPublishedAt;
			}

			function dashboardLiveRunActivityHasOverlay({ includeCompletedEmpty = false } = {}) {
				if (!dashboardLiveRunActivitySeen) {
					return false;
				}
				if (presentationCurrentLaneCards(dashboardLivePresentation).length) {
					return true;
				}

				return includeCompletedEmpty;
			}

			function clearDashboardLiveRunActivityOverlayIfCompleteEmpty() {
				if (
					dashboardLiveRunActivitySeen &&
					!presentationCurrentLaneCards(dashboardLivePresentation).length
				) {
					dashboardLiveRunActivitySeen = false;
					dashboardLivePresentation = null;
					dashboardLiveAccountControl = null;
				}
			}

			function clearDashboardLiveRunActivityOverlay() {
				dashboardLiveRunActivitySeen = false;
				dashboardLivePresentation = null;
				dashboardLiveAccountControl = null;
			}

			function snapshotWithLiveRunActivity(snapshot, options = {}) {
				if (!snapshot || !dashboardSocketIsOpen()) {
					return snapshot;
				}

				if (!dashboardLiveRunActivityHasOverlay(options)) {
					return snapshot;
				}

				const liveRuns = currentLaneRunsFromCards(
					presentationCurrentLaneCards(dashboardLivePresentation),
				);
				return {
					...snapshot,
					account_control:
						dashboardLiveAccountControl && typeof dashboardLiveAccountControl === "object"
							? { ...(snapshot.account_control || {}), ...dashboardLiveAccountControl }
							: snapshot.account_control,
					current_lanes: liveRuns,
					presentation: dashboardLivePresentation,
				};
			}

			function applyDashboardRunActivity(payload) {
				if (!payload?.presentation || typeof payload.presentation !== "object") {
					updateDashboardStreamState({
						connected: true,
						error: false,
						lastEventAt: new Date().toISOString(),
					});

					return;
				}

				if (dashboardRunActivityIsStale(payload)) {
					updateDashboardStreamState(
						{
							connected: true,
							error: false,
							lastEventAt:
								unixEpochSecondsToIso(payload.emittedAtUnixEpoch) ||
								new Date().toISOString(),
						},
						false,
					);
					return;
				}

				dashboardLivePresentation = {
					...payload.presentation,
					current_lane_cards: presentationCurrentLaneCards(payload.presentation),
				};
				dashboardLiveRunActivitySeen = true;
				dashboardLiveAccountControl =
					payload.accountControl && typeof payload.accountControl === "object"
						? { ...payload.accountControl }
						: null;

				if (!lastDashboardRender?.snapshot) {
					updateDashboardStreamState({
						connected: true,
						error: false,
						lastEventAt: new Date().toISOString(),
					});
					clearDashboardLiveRunActivityOverlayIfCompleteEmpty();

					return;
				}

				lastDashboardRender = {
					...lastDashboardRender,
					snapshot: snapshotWithLiveRunActivity(lastDashboardRender.snapshot, {
						includeCompletedEmpty: true,
					}),
				};
				updateDashboardStreamState(
					{
						connected: true,
						error: false,
						lastEventAt: unixEpochSecondsToIso(payload.emittedAtUnixEpoch) || new Date().toISOString(),
					},
					false,
				);
				renderDashboardState(lastDashboardRender);
				clearDashboardLiveRunActivityOverlayIfCompleteEmpty();
			}

			function applyDashboardSnapshotEvent(payload) {
				if (!payload?.snapshot) {
					return;
				}

				clearDashboardLiveRunActivityOverlay();
				lastDashboardRender = {
					snapshot: payload.snapshot,
					snapshotError: "",
					snapshotPublishedAt:
						unixEpochSecondsToIso(payload.snapshotPublishedAtUnixEpoch) ||
						new Date().toISOString(),
				};
				updateDashboardStreamState(
					{
						connected: true,
						error: false,
						lastEventAt: new Date().toISOString(),
					},
					false,
				);
				renderDashboardState(lastDashboardRender);
			}

			function dashboardSocketIsOpen() {
				return (
					dashboardStreamState.supported &&
					dashboardSocket &&
					dashboardSocket.readyState === window.WebSocket.OPEN
				);
			}

			function nextDashboardControlRequestId() {
				dashboardControlRequestCounter += 1;
				return `dash-${Date.now()}-${dashboardControlRequestCounter}`;
			}

			function sendDashboardSocketMessage(message) {
				if (!dashboardSocketIsOpen()) {
					recordDashboardControlEvent({
						accepted: false,
						action: message.action || message.type || "control",
						status: "offline",
						message: "Dashboard WebSocket is not connected.",
					});
					return false;
				}

				dashboardSocket.send(JSON.stringify(message));
				return true;
			}

			function syncDashboardSubscriptionToSocket() {
				sendDashboardSocketMessage({
					type: "subscribe",
					requestId: nextDashboardControlRequestId(),
					...dashboardSubscription,
				});
			}

			function sendDashboardControl(action, payload = {}) {
				return sendDashboardSocketMessage({
					type: "control",
					requestId: nextDashboardControlRequestId(),
					action,
					...payload,
				});
			}

			function dashboardControlActionLabel(action) {
				return displayToken(action);
			}

			function recordDashboardControlEvent(event) {
				const recorded = {
					key: `${event.requestId || event.action || "control"}:${Date.now()}`,
					at: new Date().toISOString(),
					accepted: Boolean(event.accepted),
					action: event.action || "control",
					status: event.status || (event.accepted ? "accepted" : "failed"),
					message: event.message || "Dashboard control response received.",
				};
				dashboardControlEvents = [recorded, ...dashboardControlEvents].slice(0, 4);
				if (lastDashboardRender) {
					renderDashboardState(lastDashboardRender);
				}
			}

			function applyDashboardControlAck(payload) {
				if (payload?.action === "ack" || payload?.action === "subscribe") {
					return;
				}
				recordDashboardControlEvent(payload || {});
			}

			function applyDashboardControlReady(payload) {
				void payload;
			}

			function connectDashboardSocket() {
				if (!dashboardStreamState.supported) {
					updateDashboardStreamState({
						connected: false,
						error: true,
					});
					return;
				}

				if (dashboardSocketReconnectTimer) {
					window.clearTimeout(dashboardSocketReconnectTimer);
					dashboardSocketReconnectTimer = null;
				}
				if (dashboardSocket) {
					dashboardSocket.onclose = null;
					dashboardSocket.onerror = null;
					dashboardSocket.close();
				}

				dashboardSocket = new WebSocket(dashboardSocketUrl());
				dashboardSocket.onopen = () => {
					updateDashboardStreamState({
						connected: true,
						error: false,
					});
					syncDashboardSubscriptionToSocket();
					};
					dashboardSocket.onclose = () => {
						dashboardLivePresentation = null;
						dashboardLiveRunActivitySeen = false;
						dashboardLiveAccountControl = null;
						updateDashboardStreamState({
						connected: false,
						error: true,
					});
					scheduleDashboardSocketReconnect();
					};
					dashboardSocket.onerror = () => {
						dashboardLivePresentation = null;
						dashboardLiveRunActivitySeen = false;
						dashboardLiveAccountControl = null;
						updateDashboardStreamState({
						connected: false,
						error: true,
					});
				};
				dashboardSocket.onmessage = (message) => {
					const event = parseDashboardSocketMessage(message);
					if (event?.type === "snapshot") {
						applyDashboardSnapshotEvent(event.payload);
					} else if (event?.type === "runActivity") {
						applyDashboardRunActivity(event.payload);
					} else if (event?.type === "controlAck") {
						applyDashboardControlAck(event.payload);
					} else if (event?.type === "controlReady") {
						applyDashboardControlReady(event.payload);
					}
				};
			}

			function renderDashboardState({
				snapshot,
				snapshotError,
				snapshotPublishedAt,
			}, options = {}) {
				const readiness = summarizeReadiness(snapshotError, snapshot);
				const notices = dashboardNotices(readiness, snapshotError, snapshot);
				const derived = buildDerivedState(snapshot);
				const reviewItems = reviewLaneItems(derived);
				const shouldRefreshAccounts = options.refreshAccounts !== false;

				if (shouldRefreshAccounts) {
					refreshAccountApiSnapshot();
				}
				renderHeader(snapshot, readiness, notices, snapshotPublishedAt, snapshotError);
				renderFlow(snapshot, derived);
				renderProjects(snapshot, derived);
				renderAccountPool(snapshot);
				renderCurrentLanes(snapshot, derived);
				renderExecutionPrograms(snapshot, derived);
				renderQueuedCandidates(
					nodes.queuedCandidates,
					derived.queueBacklogCandidates,
				);
				setPanelMeta(nodes.queuedMeta, backlogMetaText(snapshot, derived));
				renderRecentRuns(snapshot);
				renderActionCards(
					nodes.reviewQueue,
					reviewItems,
				);
				setPanelMeta(
					nodes.reviewLanesMeta,
					snapshot
						? `${pluralize(derived.postReviewLanes.length, "PR")} · ${pluralize(derived.reviewBlockerCount, "needs attention", "need attention")} · ${derived.readyItems.length} ready · ${derived.reviewWaitingCount} waiting · ${derived.cleanupCount} cleanup`
						: "0 PRs · 0 need attention · 0 ready · 0 waiting · 0 cleanup",
				);
				renderWorktrees(snapshot);
			}

			function startDashboardStream() {
				applyTheme(themeSelection, false);
				renderAccountPrivacyToggle();
				renderProjectFilterToggle();
				renderProjectLocationToggle();
				renderProjectWorkInfoState();
				applyDashboardLayout();
					lastDashboardRender = {
						snapshot: null,
						snapshotError: "",
						snapshotPublishedAt: null,
				};
				renderDashboardState(lastDashboardRender);
				connectDashboardSocket();
				startDashboardLocalClock();
			}

			for (const button of nodes.themeButtons) {
				button.addEventListener("click", () => {
					applyTheme(button.dataset.themeChoice);
				});
			}

			nodes.projectFilterToggle.addEventListener("click", () => {
				projectFilterMode = projectFilterMode === "all" ? "active" : "all";
				persistProjectFilterMode();
				if (lastDashboardRender) {
					renderDashboardState(lastDashboardRender);
					return;
				}
				renderProjectFilterToggle();
			});

			nodes.accountPool.addEventListener("click", (event) => {
				if (!(event.target instanceof Element)) {
					return;
				}

				const privacyButton = event.target.closest("[data-account-privacy-toggle]");
				if (privacyButton) {
					event.preventDefault();
					accountEmailsHidden = !accountEmailsHidden;
					persistAccountPrivacy(accountEmailsHidden);
					renderAccountPrivacyToggle();
					if (lastDashboardRender) {
						renderDashboardState(lastDashboardRender);
					}
					return;
				}

				const sortButton = event.target.closest("[data-account-sort-key]");
				if (sortButton) {
					event.preventDefault();
					const key = sortButton.dataset.accountSortKey;
					if (!isAccountPoolSortKey(key)) {
						return;
					}

					accountPoolSort = {
						key,
						direction:
							accountPoolSort.key === key && accountPoolSort.direction === "asc"
								? "desc"
								: "asc",
					};
					persistAccountPoolSort();
					if (lastDashboardRender) {
						renderDashboardState(lastDashboardRender);
					}
					return;
				}

				const profileToggle = event.target.closest("[data-account-profile-toggle]");
				if (profileToggle) {
					event.preventDefault();
					toggleCodexAccountProfileKey(profileToggle.dataset.accountProfileToggle);
					return;
				}

				const confirmButton = event.target.closest("[data-account-confirm-action]");
				if (confirmButton) {
					event.preventDefault();
					const action = confirmButton.dataset.accountConfirmAction;
					const accountSelector = confirmButton.dataset.accountSelector || null;
					handleAccountSelectionConfirmation(action, accountSelector);
					return;
				}

				const button = event.target.closest("[data-account-name-reroll]");
				if (button) {
					event.preventDefault();
					const key = button.dataset.accountNameReroll;
					if (!key) {
						return;
					}

					const account = lastDashboardRender
						? codexAccountPoolAccounts(lastDashboardRender.snapshot).find(
								(candidate) => codexAccountRandomNameKey(candidate) === key,
							)
						: null;
					const current = account
						? codexAccountRandomNameOffset(account)
						: normalizeAccountNameOffset(pendingAccountNameOffsets[key]);
					const next = normalizeAccountNameOffset(current + 1);
					pendingAccountNameOffsets = {
						...pendingAccountNameOffsets,
						[key]: next,
					};
					if (lastDashboardRender) {
						renderDashboardState(lastDashboardRender);
					}
					if (account) {
						postAccountNameOffset(account, next)
							.then((updated) => {
								if (updated) {
									delete pendingAccountNameOffsets[key];
									if (lastDashboardRender) {
										renderDashboardState(lastDashboardRender);
									}
								}
							})
							.catch(() => {});
					}
					return;
				}

				const profileRow = event.target.closest("[data-account-profile-row-toggle]");
				if (profileRow && !accountProfileRowClickIsSuppressed(event.target)) {
					event.preventDefault();
					toggleCodexAccountProfileKey(profileRow.dataset.accountProfileRowToggle);
				}
			});

			nodes.projectOverview.addEventListener("click", (event) => {
				if (!(event.target instanceof Element)) {
					return;
				}

				const sortButton = event.target.closest("[data-project-sort-key]");
				if (sortButton) {
					event.preventDefault();
					const key = sortButton.dataset.projectSortKey;
					if (!isProjectSortKey(key)) {
						return;
					}

					projectSort = {
						key,
						direction:
							projectSort.key === key
								? projectSort.direction === "asc"
									? "desc"
									: "asc"
								: projectSortDefaultDirection(key),
					};
					persistProjectSort();
					if (lastDashboardRender) {
						renderDashboardState(lastDashboardRender);
					}
					return;
				}

				const locationToggle = event.target.closest("[data-project-location-toggle]");
				if (locationToggle) {
					event.preventDefault();
					projectLocationsHidden = !projectLocationsHidden;
					persistProjectLocationPrivacy(projectLocationsHidden);
					if (lastDashboardRender) {
						renderDashboardState(lastDashboardRender);
						return;
					}
					renderProjectLocationToggle();
					return;
				}

				const workInfo = event.target.closest("[data-project-work-info]");
				if (!workInfo) {
					return;
				}

				event.preventDefault();
				projectWorkInfoOpen = !projectWorkInfoOpen;
				renderProjectWorkInfoState();
			});

			if (typeof themeMediaQuery.addEventListener === "function") {
				themeMediaQuery.addEventListener("change", () => {
					if (themeSelection === "system") {
						applyTheme("system", false);
					}
				});
			} else if (typeof themeMediaQuery.addListener === "function") {
				themeMediaQuery.addListener(() => {
					if (themeSelection === "system") {
						applyTheme("system", false);
					}
				});
			}

			document.addEventListener("click", (event) => {
				if (!(event.target instanceof Element)) {
					return;
				}

				if (
					accountSelectionConfirmation &&
					!event.target.closest("[data-account-confirm-action]")
				) {
					clearAccountSelectionConfirmation(true);
				}

				if (!event.target.closest("[data-project-work-info]")) {
					projectWorkInfoOpen = false;
					renderProjectWorkInfoState();
				}

				const noticeAck = event.target.closest("[data-notice-ack]");
				if (noticeAck) {
					event.preventDefault();
					const ackKey = noticeAck.dataset.noticeAck;
					dashboardControlEvents = dashboardControlEvents.filter(
						(controlEvent) => controlEvent.key !== ackKey,
					);
					sendDashboardControl("ack", { key: ackKey });
					if (lastDashboardRender) {
						renderDashboardState(lastDashboardRender);
					}
					return;
				}

				const summary = event.target.closest("summary");
				if (!summary) {
					return;
				}

				const details = summary.parentElement;
				if (!(details instanceof HTMLDetailsElement)) {
					return;
				}

				event.preventDefault();
				animateDetail(details, !details.open);
			});

			document.addEventListener("visibilitychange", () => {
				if (document.hidden) {
					return;
				}

				if (lastDashboardRender) {
					renderDashboardState(lastDashboardRender);
				}
				if (!dashboardSocketIsOpen()) {
					connectDashboardSocket();
				}
			});

			startDashboardStream();
		</script>
	</body>
</html>
