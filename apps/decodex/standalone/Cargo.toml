[workspace]
resolver = "3"

[package]
authors     = ["Xavier Lau <x@acg.box>"]
build       = "../build.rs"
description = "Frozen Decodex v0.2 binaries retained for macOS app packaging."
edition     = "2024"
homepage    = "https://decodex.space"
license     = "GPL-3.0"
name        = "decodex"
repository  = "https://github.com/hack-ink/decodex"
version     = "0.2.0"

[lib]
path = "../src/lib.rs"

[[bin]]
name = "decodex"
path = "../src/main.rs"

[[bin]]
name = "decodex-app-helper"
path = "../src/bin/decodex-app-helper.rs"

[build-dependencies]
vergen-gitcl = { version = "10.0", features = ["cargo"] }

[dependencies]
base64             = { version = "0.22" }
clap               = { version = "4.6", features = ["derive"] }
color-eyre         = { version = "0.6" }
globset            = { version = "0.4" }
libc               = { version = "0.2" }
reqwest            = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite           = { version = "0.40", features = ["bundled"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = { version = "1.0" }
sha1               = { version = "0.11" }
sha2               = { version = "0.11" }
time               = { version = "0.3", features = ["formatting"] }
toml               = { version = "1.1" }
toml_edit          = { version = "0.25" }
tracing            = { version = "0.1" }
tracing-appender   = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
