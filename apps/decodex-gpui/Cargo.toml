[package]
authors.workspace    = true
description          = "Production GPUI macOS shell for Decodex vNext."
edition.workspace    = true
homepage.workspace   = true
license.workspace    = true
name                 = "decodex-gpui"
repository.workspace = true
version.workspace    = true

[features]
native-glass-probe = []
visual-capture     = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
decodex-protocol     = { workspace = true }
gpui                 = { workspace = true }
gpui_platform        = { workspace = true }
libc                 = { workspace = true }
pulldown-cmark       = { workspace = true }
raw-window-handle    = "0.6.2"
reqwest              = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
sha2                 = { workspace = true }
time                 = { workspace = true }
tokio                = { workspace = true }
unicode-segmentation = "1.13.3"
unicode-width        = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2                 = { workspace = true }
futures-util           = { workspace = true }
libwebrtc              = { workspace = true }
objc2                  = { version = "~0.6" }
objc2-app-kit          = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-audio-toolbox    = { workspace = true }
objc2-avf-audio        = { workspace = true }
objc2-core-audio-types = { workspace = true }
objc2-foundation       = { version = "=0.3.2", default-features = false, features = ["NSDate", "NSRunLoop", "NSString"] }
rtrb                   = { workspace = true }

[dev-dependencies]
futures-util      = { workspace = true }
gpui              = { workspace = true, features = ["test-support"] }
tempfile          = { workspace = true }
tokio-tungstenite = { workspace = true }

[[bin]]
name              = "decodex-gpui-workbench-visual-capture"
path              = "src/bin/workbench_visual_capture.rs"
required-features = ["visual-capture"]

[[bin]]
name              = "decodex-native-glass-probe"
path              = "src/bin/native_glass_probe.rs"
required-features = ["native-glass-probe"]
