[package]
authors.workspace    = true
description          = "Production GPUI macOS shell for Decodex vNext."
edition.workspace    = true
homepage.workspace   = true
license.workspace    = true
name                 = "decodex-gpui"
repository.workspace = true
version.workspace    = true

[features]
native-glass-probe = []
visual-capture     = ["gpui/leak-detection", "gpui/test-support", "gpui_platform/test-support"]

[dependencies]
base64               = { workspace = true }
decodex-components   = { workspace = true }
decodex-pro-bridge   = { workspace = true }
decodex-protocol     = { workspace = true }
gpui                 = { workspace = true }
gpui_platform        = { workspace = true }
libc                 = { workspace = true }
ondine               = { workspace = true }
pulldown-cmark       = { workspace = true }
raw-window-handle    = { workspace = true }
reqwest              = { workspace = true }
roxmltree            = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
sha2                 = { workspace = true }
time                 = { workspace = true }
tokio                = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width        = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2                 = { workspace = true }
futures-util           = { workspace = true }
libwebrtc              = { workspace = true }
objc2                  = { workspace = true }
objc2-app-kit          = { workspace = true, features = ["NSEvent"] }
objc2-audio-toolbox    = { workspace = true, features = ["AudioQueue", "objc2-core-foundation"] }
objc2-core-audio-types = { workspace = true }
objc2-core-foundation  = { workspace = true }
objc2-foundation       = { workspace = true, features = ["NSDateFormatter", "NSNotification", "NSOperation", "NSTimeZone", "block2"] }
rtrb                   = { workspace = true }

[dev-dependencies]
futures-util      = { workspace = true }
gpui              = { workspace = true, features = ["leak-detection", "test-support"] }
tempfile          = { workspace = true }
tokio-tungstenite = { workspace = true }

# Diagnostic executables reuse app modules; shared tests run in the app target.
[[bin]]
bench             = false
name              = "decodex-gpui-workbench-visual-capture"
path              = "src/bin/workbench_visual_capture.rs"
required-features = ["visual-capture"]
test              = false

[[bin]]
bench             = false
name              = "decodex-native-glass-probe"
path              = "src/bin/native_glass_probe.rs"
required-features = ["native-glass-probe"]
test              = false
