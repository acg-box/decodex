[package]
authors.workspace    = true
description          = "Unified Decodex command-line client and service composition root."
edition.workspace    = true
homepage.workspace   = true
license.workspace    = true
name                 = "decodex-cli"
repository.workspace = true
version.workspace    = true

[[bin]]
name = "decodex"
path = "src/main.rs"

[dependencies]
clap             = { workspace = true }
decodex-protocol = { workspace = true }
decodex-runtime  = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
toml_edit        = { version = "=0.22.27" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { workspace = true }

[features]
process-acceptance-fixture = ["decodex-runtime/process-acceptance-fixture"]

[dev-dependencies]
base64           = { workspace = true }
decodex-core     = { workspace = true }
decodex-database = { workspace = true }
rusqlite         = { workspace = true }
tempfile         = { workspace = true }
