[package]
authors.workspace    = true
description          = "Service lifecycle and adapter composition for Decodex vNext."
edition.workspace    = true
homepage.workspace   = true
license.workspace    = true
name                 = "decodex-runtime"
repository.workspace = true
version.workspace    = true

[features]
account-binding-fixtures = ["decodex-postgres/test-support"]
retained-title-experiment = []

[[bin]]
name              = "decodex-retained-title-experiment"
path              = "src/bin/decodex-retained-title-experiment.rs"
required-features = ["retained-title-experiment"]

[dependencies]
decodex-codex    = { workspace = true }
decodex-core     = { workspace = true }
decodex-postgres = { workspace = true }
decodex-protocol = { workspace = true }
futures-util     = { workspace = true }
libc             = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
tempfile         = { workspace = true }
tokio            = { workspace = true }
tokio-tungstenite = { workspace = true }
zeroize          = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile          = { workspace = true }
tokio-postgres    = { workspace = true }
