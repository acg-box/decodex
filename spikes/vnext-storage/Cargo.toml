[package]
authors.workspace    = true
description          = "Focused PostgreSQL, blob, and bounded-cache feasibility proof for Decodex vNext."
edition.workspace    = true
license.workspace    = true
name                 = "decodex-vnext-storage-proof"
publish              = false
repository.workspace = true
version.workspace    = true

[dependencies]
deadpool-postgres = "=0.14.1"
refinery          = { version = "=0.9.2", default-features = false, features = ["tokio-postgres"] }
serde_json        = { workspace = true }
sha2              = { workspace = true }
tokio             = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres    = { version = "=0.7.18", features = ["with-serde_json-1"] }
