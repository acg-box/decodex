[workspace]
members = [
	"apps/decodex-cli",
	"apps/decodex-gpui",
	"apps/decodex-publisher",
	"apps/radar",
	"crates/decodex-account-login",
	"crates/decodex-app-client-ffi",
	"crates/decodex-codex",
	"crates/decodex-core",
	"crates/decodex-protocol",
	"crates/decodex-runtime",
	"database",
	"database/transfer",
]
resolver = "3"

[workspace.package]
authors     = ["Xavier Lau <x@acg.box>"]
description = "Decodex runtime, static site, and local operator tooling."
edition     = "2024"
homepage    = "https://decodex.space"
license     = "GPL-3.0"
repository  = "https://github.com/acg-box/decodex"
version     = "0.2.0"

[workspace.dependencies]
decodex-account-login = { path = "crates/decodex-account-login" }
decodex-codex         = { path = "crates/decodex-codex" }
decodex-core          = { path = "crates/decodex-core" }
decodex-database      = { path = "database" }
decodex-protocol      = { path = "crates/decodex-protocol" }
decodex-runtime       = { path = "crates/decodex-runtime" }
pulldown-cmark        = { version = "~0.13", default-features = false }
unicode-width         = { version = "~0.2" }

base64                 = { version = "~0.23" }
block2                 = { version = "~0.6" }
clap                   = { version = "~4.6", features = ["derive"] }
color-eyre             = { version = "~0.6" }
core-foundation        = { version = "~0.10" }
futures-util           = { version = "~0.3" }
getrandom              = { version = "~0.4" }
globset                = { version = "~0.4" }
gpui                   = { git = "https://github.com/zed-industries/zed.git", rev = "c0199504b9cce79bc27524950022ed701bc3ebd5", default-features = false, features = ["profiler"] }
gpui_platform          = { git = "https://github.com/zed-industries/zed.git", rev = "c0199504b9cce79bc27524950022ed701bc3ebd5", default-features = false, features = ["font-kit"] }
httparse               = { version = "~1.10" }
libc                   = { version = "~0.2" }
libwebrtc              = { version = "~0.3" }
objc2-audio-toolbox    = { version = "~0.3", default-features = false, features = ["AUComponent", "AudioComponent", "AudioUnitProperties", "objc2-core-audio-types", "std"] }
objc2-avf-audio        = { version = "~0.3", default-features = false, features = ["AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioMixerNode", "AVAudioMixing", "AVAudioNode", "AVAudioSinkNode", "AVAudioSourceNode", "AVAudioTypes", "block2", "objc2-audio-toolbox", "objc2-core-audio-types", "std"] }
objc2-core-audio-types = { version = "~0.3", default-features = false, features = ["CoreAudioBaseTypes", "std"] }
percent-encoding       = { version = "~2.3" }
redb                   = { version = "~4.3", default-features = false }
regex                  = { version = "~1.13" }
reqwest                = { version = "~0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rtrb                   = { version = "~0.4" }
rusqlite               = { version = "~0.40", features = ["bundled"] }
rustix                 = { version = "~1.1", features = ["fs"] }
security-framework     = { version = "~3.7", default-features = false, features = ["OSX_10_15"] }
serde                  = { version = "~1.0", features = ["derive"] }
serde_json             = { version = "~1.0" }
sha1                   = { version = "~0.11" }
sha2                   = { version = "~0.11" }
tempfile               = { version = "~3.27" }
time                   = { version = "~0.3", features = ["formatting"] }
tokio                  = { version = "~1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite      = { version = "~0.30" }
toml                   = { version = "~1.1" }
toml_edit              = { version = "~0.25" }
tracing                = { version = "~0.1" }
tracing-appender       = { version = "~0.2" }
tracing-subscriber     = { version = "~0.3", features = ["env-filter"] }
url                    = { version = "~2.5" }
vergen-gitcl           = { version = "~10.0", features = ["cargo"] }
wait-timeout           = { version = "~0.2" }
zeroize                = { version = "~1.9" }

objc2                = { version = "~0.6" }
objc2-app-kit        = { version = "~0.3", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-foundation     = { version = "~0.3", default-features = false, features = ["NSDate", "NSRunLoop", "NSString"] }
raw-window-handle    = { version = "~0.6" }
unicode-segmentation = { version = "~1.13" }

[profile.release]
lto = "thin"
