[workspace]
exclude  = ["apps/decodex-app"]
members  = ["apps/*"]
resolver = "3"

[workspace.package]
authors     = ["Xavier Lau <x@acg.box>"]
description = "Decodex runtime, static site, and local operator tooling."
edition     = "2024"
homepage    = "https://decodex.space"
license     = "GPL-3.0"
repository  = "https://github.com/hack-ink/decodex"
version     = "0.2.0"

[workspace.dependencies]
base64             = { version = "0.22" }
clap               = { version = "4.6", features = ["derive"] }
color-eyre         = { version = "0.6" }
ed25519-dalek      = { version = "2.2" }
globset            = { version = "0.4" }
gix                = { version = "=0.85.0", default-features = false, features = ["revision", "sha1", "sha256"] }
libc               = { version = "0.2" }
minicbor           = { version = "=2.2.2", features = ["derive", "std"] }
regex              = { version = "1.12" }
reqwest            = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite           = { version = "0.40", features = ["bundled"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = { version = "1.0" }
serde_yaml         = { version = "0.9" }
sha1               = { version = "0.11" }
sha2               = { version = "0.11" }
tempfile           = { version = "3.27" }
time               = { version = "0.3", features = ["formatting"] }
toml               = { version = "1.1" }
toml_edit          = { version = "0.25" }
tracing            = { version = "0.1" }
tracing-appender   = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vergen-gitcl       = { version = "10.0", features = ["cargo"] }

[profile.final-release]
inherits = "release"
lto      = true
