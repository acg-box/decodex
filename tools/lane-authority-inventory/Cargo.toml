[workspace]

[package]
edition = "2024"
name    = "lane-authority-inventory"
publish = false
version = "0.1.0"

[dependencies]
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
sha2                = "0.10"
tree-sitter         = "0.25"
tree-sitter-bash    = "0.25.1"
tree-sitter-python  = "0.25.0"
tree-sitter-rust    = "0.24.2"
tree-sitter-swift   = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml    = "0.7.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all         = "deny"
unwrap_used = "deny"
