# Path inventory and repository-root marker. Runtime defaults are defined in
# apps/radar/src/paths.rs; these values do not override them.
version = 1

[paths]
cache_root        = ".agent/automations/radar/cache"
generated_root    = ".agent/automations/radar/cache/generated"
github_root       = ".agent/automations/radar/cache/github"
site_content_root = ".agent/automations/radar/cache/site-content"
