retired_automation_ids = ["decodex-x-browser-publisher"]
version                = 1

[defaults]
allowed_external_cache_prefixes = [
	".agent/automations/radar/cache",
	".agent/automations/upstream/cache",
]
cache_root = ".agent/automations/decodex/cache"
cwd = "{repo_root}"
execution_environment = "local"
forbidden_prompt_fragments = [
	".agent/decodex",
	".codex/decodex",
	".github/workflows",
	"/Users/",
	"/home/",
	"DECODEX_AGENT_HOME",
	"Documents/automations",
	"accounts.jsonl",
	"auth.json",
	"migrate-agent-home",
	"runtime.sqlite3",
	"site/src/content",
	"~/.codex/decodex",
]
kind = "cron"
reasoning_effort = "high"
source_root = "automations/decodex"
status = "ACTIVE"

