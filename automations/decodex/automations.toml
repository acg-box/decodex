id = "decodex-content-manager"
model = "gpt-5.6-terra"
name = "Decodex Content Manager"
prompt_file = "automations/decodex/prompts/content-manager.md"
required_cache_prefixes = [
	".agent/automations/decodex/cache/manager",
	".agent/automations/decodex/cache/social/x/candidates",
	".agent/automations/decodex/cache/social/x/outcomes",
	".agent/automations/decodex/cache/social/x/posts",
