# Decodex workspace tasks.

# Audit
# | task                    | type      | cwd  |
# | ----------------------- | --------- | ---- |
# | audit-node              | composite |      |
# | audit-node-advisories   | command   | site |
# | audit-node-lock         | command   |      |
# | audit-node-provenance   | command   |      |
# | audit-node-runtime      | command   |      |
# | audit-node-signatures   | command   | site |
# | audit-vstyle-rust       | command   |      |
# | prepare-node            | command   | site |

[tasks.audit-node]
workspace = false
dependencies = [
	"audit-node-lock",
	"prepare-node",
	"audit-node-advisories",
	"audit-node-provenance",
	"audit-node-signatures",
]

[tasks.audit-node-advisories]
workspace = false
cwd = "site"
dependencies = ["audit-node-lock"]
command = "npm"
args = [
	"audit",
	"--audit-level=high",
]

[tasks.audit-node-signatures]
workspace = false
cwd = "site"
dependencies = ["audit-node-lock"]
command = "npm"
args = [
	"audit",
	"signatures",
]

[tasks.audit-node-lock]
workspace = false
command = "python3"
args = [
	"scripts/audit_node_lock.py",
	"--lock-only",
]

[tasks.audit-node-provenance]
workspace = false
dependencies = ["prepare-node"]
command = "python3"
args = [
	"scripts/audit_node_lock.py",
]

[tasks.audit-node-runtime]
workspace = false
command = "python3"
args = [
	"scripts/audit_node_lock.py",
	"--runtime-only",
]

[tasks.audit-vstyle-rust]
workspace = false
command = "python3"
args = [
	"scripts/vstyle_audit.py",
]

[tasks.prepare-node]
workspace = false
cwd = "site"
dependencies = ["audit-node-lock"]
command = "npm"
args = [
	"ci",
	"--ignore-scripts",
]

# Check
# | task              | type      | cwd  |
# | ----------------- | --------- | ---- |
# | check             | composite |      |
# | check-node        | composite |      |
# | check-node-types  | command   | site |
# | check-rust        | command   |      |
# | check-rust-headless | command |      |
# | check-sandboxed   | composite |      |
# | check-automations | composite | |
# | check-automations-sandboxed | composite | |

[tasks.check]
clear = true
workspace = false
dependencies = [
	"audit-node",
	"build",
	"check-node",
	"check-rust",
	"fmt-check",
	"lint",
	"test",
]

[tasks.check-automations]
clear = true
workspace = false
dependencies = [
	"audit-node",
	"build",
	"check-node",
	"check-rust-headless",
	"fmt-check",
	"lint-rust-headless",
	"test-headless",
]

[tasks.check-automations-sandboxed]
clear = true
workspace = false
dependencies = [
	"build",
	"check-node",
	"check-rust-headless",
	"fmt-check-sandboxed",
	"lint-rust-headless",
	"test-headless-sandboxed",
]

[tasks.check-sandboxed]
clear = true
workspace = false
dependencies = [
	"build",
	"check-node",
	"check-rust",
	"fmt-check-sandboxed",
	"lint",
	"test-sandboxed",
]

[tasks.check-node]
workspace = false
dependencies = [
	"check-node-types",
]

[tasks.check-node-types]
workspace = false
cwd = "site"
dependencies = ["audit-node-lock"]
command = "npm"
args = [
	"run",
	"check",
]

[tasks.check-rust]
workspace = false
command = "cargo"
args = [
	"check",
	"--all-features",
	"--all-targets",
	"--workspace",
]

[tasks.check-rust-headless]
workspace = false
command = "cargo"
args = [
	"check",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--exclude",
	"decodex-gpui",
]

# Build
# | task                                      | type      | cwd  |
# | ----------------------------------------- | --------- | ---- |
# | build                                     | composite |      |
# | build-node                                | command   | site |

[tasks.build]
clear = true
workspace = false
dependencies = [
	"build-node",
]

[tasks.build-node]
workspace = false
cwd = "site"
dependencies = ["audit-node-lock"]
command = "npm"
args = [
	"run",
	"build",
]

# Format
# | task           | type      | cwd |
# | -------------- | --------- | --- |
# | fmt            | composite |     |
# | fmt-check      | composite |     |
# | fmt-check-sandboxed | composite | |
# | fmt-rust       | command   |     |
# | fmt-rust-check | extend    |     |
# | fmt-rust-check-sandboxed | command | |
# | fmt-toml       | command   |     |
# | fmt-toml-check | extend    |     |

[tasks.fmt]
workspace = false
dependencies = [
	"fmt-rust",
	"fmt-toml",
]

[tasks.fmt-check]
workspace = false
dependencies = [
	"fmt-rust-check",
	"fmt-toml-check",
]

[tasks.fmt-check-sandboxed]
workspace = false
dependencies = [
	"fmt-rust-check-sandboxed",
	"fmt-toml-check",
]

[tasks.fmt-rust]
workspace = false
command = "rustup"
args = [
	"run",
	"nightly-2026-07-16",
	"cargo",
	"fmt",
	"--all",
]

[tasks.fmt-rust-check]
extend = "fmt-rust"
args = [
	"run",
	"nightly-2026-07-16",
	"cargo",
	"fmt",
	"--all",
	"--",
	"--check",
]

[tasks.fmt-rust-check-sandboxed]
workspace = false
command = "${DECODEX_TRUSTED_NIGHTLY_CARGO_FMT}"
args = [
	"--all",
	"--",
	"--check",
]

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = [
	"fmt",
]

[tasks.fmt-toml-check]
extend = "fmt-toml"
args = [
	"fmt",
	"--check",
]

# Lint
# | task      | type      | cwd |
# | --------- | --------- | --- |
# | lint      | composite |     |
# | lint-rust | command   |     |
# | lint-rust-headless | command | |

[tasks.lint]
workspace = false
dependencies = [
	"lint-rust",
]

[tasks.lint-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-rust-headless]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--exclude",
	"decodex-gpui",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

# Fix
# | task          | type      | cwd |
# | ------------- | --------- | --- |
# | lint-fix      | composite |     |
# | lint-rust-fix | command   |     |

[tasks.lint-fix]
workspace = false
dependencies = [
	"lint-rust-fix",
]

[tasks.lint-rust-fix]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--fix",
	"--allow-dirty",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

# Test
# | task                               | type      | cwd |
# | ---------------------------------- | --------- | --- |
# | test                               | composite |     |
# | test-automations                   | command   |     |
# | test-headless                      | composite |     |
# | test-headless-sandboxed            | composite |     |
# | test-gate-contract                 | command   |     |
# | test-rust                          | command   |     |
# | test-rust-headless                 | command   |     |
# | test-sandboxed                     | composite |     |
# | test-vnext-architecture            | command   |     |
# | test-vnext-cli-diagnostics         | command   |     |
# | test-vnext-latest-schema           | command   |     |

[tasks.test]
clear = true
workspace = false
dependencies = [
	"test-automations",
	"test-gate-contract",
	"test-rust",
	"test-vnext-architecture",
	"test-vnext-cli-diagnostics",
]

[tasks.test-automations]
workspace = false
command = "python3"
args = [
	"-m",
	"unittest",
	"automations.decodex.scripts.config.tests.test_portfolio",
]

[tasks.test-sandboxed]
clear = true
workspace = false
dependencies = [
	"test-automations",
	"test-gate-contract",
	"test-rust",
	"test-vnext-architecture",
	"test-vnext-cli-diagnostics",
]

[tasks.test-headless]
clear = true
workspace = false
dependencies = [
	"test-automations",
	"test-gate-contract",
	"test-rust-headless",
	"test-vnext-architecture",
	"test-vnext-cli-diagnostics",
]

[tasks.test-headless-sandboxed]
clear = true
workspace = false
dependencies = [
	"test-automations",
	"test-gate-contract",
	"test-rust-headless",
	"test-vnext-architecture",
	"test-vnext-cli-diagnostics",
]

[tasks.test-gate-contract]
workspace = false
command = "python3"
args = [
	"-m",
	"unittest",
	"tests/scripts/test_cli_diagnostics_runner.py",
	"tests/scripts/test_gate_contract.py",
	"tests/scripts/test_vstyle_audit.py",
]

[tasks.test-rust]
workspace = false
command = "cargo"
args = [
	"nextest",
	"run",
	"--workspace",
	"--all-targets",
	"--all-features",
]

[tasks.test-rust-headless]
workspace = false
command = "cargo"
args = [
	"nextest",
	"run",
	"--workspace",
	"--all-targets",
	"--all-features",
	"--exclude",
	"decodex-gpui",
]

[tasks.test-vnext-architecture]
workspace = false
command = "python3"
args = [
	"-m",
	"unittest",
	"tests/scripts/test_vnext_architecture.py",
]

[tasks.test-vnext-cli-diagnostics]
workspace = false
command = "python3"
args = [
	"scripts/vnext/cli_diagnostics_test.py",
]

[tasks.test-vnext-latest-schema]
workspace = false
command = "python3"
args = [
	"scripts/vnext/latest_schema_gate.py",
]
