# Decodex workspace tasks.

# Check
# | task              | type      | cwd  |
# | ----------------- | --------- | ---- |
# | check             | composite |      |
# | check-node        | composite |      |
# | check-node-types  | command   | site |
# | check-rust        | command   |      |

[tasks.check]
clear = true
workspace = false
dependencies = [
	"build",
	"check-node",
	"check-rust",
	"fmt-check",
	"lint",
	"test",
]

[tasks.check-node]
workspace = false
dependencies = [
	"check-node-types",
]

[tasks.check-node-types]
workspace = false
cwd = "site"
command = "npm"
args = [
	"run",
	"check",
]

[tasks.check-rust]
workspace = false
command = "cargo"
args = [
	"check",
	"--all-features",
	"--all-targets",
	"--workspace",
]

# Build
# | task       | type      | cwd  |
# | ---------- | --------- | ---- |
# | build      | composite |      |
# | build-node | command   | site |

[tasks.build]
clear = true
workspace = false
dependencies = [
	"build-node",
]

[tasks.build-node]
workspace = false
cwd = "site"
command = "npm"
args = [
	"run",
	"build",
]

# Format
# | task           | type      | cwd |
# | -------------- | --------- | --- |
# | fmt            | composite |     |
# | fmt-check      | composite |     |
# | fmt-rust       | command   |     |
# | fmt-rust-check | extend    |     |
# | fmt-toml       | command   |     |
# | fmt-toml-check | extend    |     |

[tasks.fmt]
workspace = false
dependencies = [
	"fmt-rust",
	"fmt-toml",
]

[tasks.fmt-check]
workspace = false
dependencies = [
	"fmt-rust-check",
	"fmt-toml-check",
]

[tasks.fmt-rust]
workspace = false
command = "rustup"
args = [
	"run",
	"nightly",
	"cargo",
	"fmt",
	"--all",
]

[tasks.fmt-rust-check]
extend = "fmt-rust"
args = [
	"run",
	"nightly",
	"cargo",
	"fmt",
	"--all",
	"--",
	"--check",
]

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = [
	"fmt",
]

[tasks.fmt-toml-check]
extend = "fmt-toml"
args = [
	"fmt",
	"--check",
]

# Lint
# | task              | type      | cwd |
# | ----------------- | --------- | --- |
# | lint              | composite |     |
# | lint-rust         | command   |     |
# | lint-vstyle-rust  | command   |     |

[tasks.lint]
workspace = false
dependencies = [
	"lint-rust",
	"lint-vstyle-rust",
]

[tasks.lint-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-vstyle-rust]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"curate",
	"--language",
	"rust",
	"--workspace",
	"--all-features",
]

# Fix
# | task             | type      | cwd |
# | ---------------- | --------- | --- |
# | lint-fix         | composite |     |
# | lint-rust-fix    | command   |     |
# | lint-vstyle-fix  | command   |     |

[tasks.lint-fix]
workspace = false
dependencies = [
	"lint-rust-fix",
	"lint-vstyle-fix",
]

[tasks.lint-rust-fix]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--fix",
	"--allow-dirty",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-vstyle-fix]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"tune",
	"--language",
	"rust",
	"--workspace",
	"--all-features",
	"--strict",
]

# Test
# | task                     | type      | cwd |
# | ------------------------ | --------- | --- |
# | test                     | composite |     |
# | test-rust                | command   |     |
# | test-vnext-architecture  | command   |     |
# | test-vnext-postgres-store | command   |     |
# | test-vnext-storage-proof  | command   |     |

[tasks.test]
clear = true
workspace = false
dependencies = [
	"test-rust",
	"test-vnext-architecture",
]

[tasks.test-rust]
workspace = false
command = "cargo"
args = [
	"nextest",
	"run",
	"--workspace",
	"--all-targets",
	"--all-features",
]

[tasks.test-vnext-architecture]
workspace = false
command = "python3"
args = [
	"-m",
	"unittest",
	"tests/scripts/test_vnext_architecture.py",
]

[tasks.test-vnext-postgres-store]
workspace = false
command = "python3"
args = [
	"scripts/vnext/postgres_store_test.py",
]

[tasks.test-vnext-storage-proof]
workspace = false
command = "python3"
args = [
	"spikes/vnext-storage/proof.py",
]
