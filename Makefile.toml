# Decodex workspace tasks.

# Audit
# | task              | type    | cwd |
# | ----------------- | ------- | --- |
# | audit-vstyle-rust | command |     |

[tasks.audit-vstyle-rust]
workspace = false
command = "python3"
args = [
	"scripts/vstyle_audit.py",
]

# Check
# | task              | type      | cwd  |
# | ----------------- | --------- | ---- |
# | check             | composite |      |
# | check-node        | composite |      |
# | check-node-types  | command   | site |
# | check-rust        | command   |      |

[tasks.check]
clear = true
workspace = false
dependencies = [
	"build",
	"check-node",
	"check-rust",
	"fmt-check",
	"lint",
	"test",
]

[tasks.check-node]
workspace = false
dependencies = [
	"check-node-types",
]

[tasks.check-node-types]
workspace = false
cwd = "site"
command = "npm"
args = [
	"run",
	"check",
]

[tasks.check-rust]
workspace = false
command = "cargo"
args = [
	"check",
	"--all-features",
	"--all-targets",
	"--workspace",
]

# Build
# | task       | type      | cwd  |
# | ---------- | --------- | ---- |
# | build      | composite |      |
# | build-node | command   | site |

[tasks.build]
clear = true
workspace = false
dependencies = [
	"build-node",
]

[tasks.build-node]
workspace = false
cwd = "site"
command = "npm"
args = [
	"run",
	"build",
]

# Format
# | task           | type      | cwd |
# | -------------- | --------- | --- |
# | fmt            | composite |     |
# | fmt-check      | composite |     |
# | fmt-rust       | command   |     |
# | fmt-rust-check | extend    |     |
# | fmt-toml       | command   |     |
# | fmt-toml-check | extend    |     |

[tasks.fmt]
workspace = false
dependencies = [
	"fmt-rust",
	"fmt-toml",
]

[tasks.fmt-check]
workspace = false
dependencies = [
	"fmt-rust-check",
	"fmt-toml-check",
]

[tasks.fmt-rust]
workspace = false
command = "rustup"
args = [
	"run",
	"nightly-2026-07-16",
	"cargo",
	"fmt",
	"--all",
]

[tasks.fmt-rust-check]
extend = "fmt-rust"
args = [
	"run",
	"nightly-2026-07-16",
	"cargo",
	"fmt",
	"--all",
	"--",
	"--check",
]

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = [
	"fmt",
]

[tasks.fmt-toml-check]
extend = "fmt-toml"
args = [
	"fmt",
	"--check",
]

# Lint
# | task      | type      | cwd |
# | --------- | --------- | --- |
# | lint      | composite |     |
# | lint-rust | command   |     |

[tasks.lint]
workspace = false
dependencies = [
	"lint-rust",
]

[tasks.lint-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

# Fix
# | task          | type      | cwd |
# | ------------- | --------- | --- |
# | lint-fix      | composite |     |
# | lint-rust-fix | command   |     |

[tasks.lint-fix]
workspace = false
dependencies = [
	"lint-rust-fix",
]

[tasks.lint-rust-fix]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--fix",
	"--allow-dirty",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

# Test
# | task                               | type      | cwd |
# | ---------------------------------- | --------- | --- |
# | test                               | composite |     |
# | test-gate-contract                 | command   |     |
# | test-rust                          | command   |     |
# | test-vnext-architecture            | command   |     |
# | test-vnext-cli-diagnostics         | command   |     |
# | test-vnext-postgres-managed-runs   | command   |     |
# | test-vnext-postgres-store          | command   |     |
# | test-vnext-storage-proof           | command   |     |

[tasks.test]
clear = true
workspace = false
dependencies = [
	"test-gate-contract",
	"test-rust",
	"test-vnext-architecture",
	"test-vnext-cli-diagnostics",
]

[tasks.test-gate-contract]
workspace = false
command = "python3"
args = [
	"-m",
	"unittest",
	"tests/scripts/test_gate_contract.py",
	"tests/scripts/test_vstyle_audit.py",
]

[tasks.test-rust]
workspace = false
command = "cargo"
args = [
	"nextest",
	"run",
	"--workspace",
	"--all-targets",
	"--all-features",
]

[tasks.test-vnext-architecture]
workspace = false
command = "python3"
args = [
	"-m",
	"unittest",
	"tests/scripts/test_vnext_architecture.py",
]

[tasks.test-vnext-cli-diagnostics]
workspace = false
command = "python3"
args = [
	"scripts/vnext/cli_diagnostics_test.py",
]

[tasks.test-vnext-postgres-managed-runs]
workspace = false
command = "python3"
args = [
	"scripts/vnext/postgres_store_test.py",
	"--focus-managed-runs",
]

[tasks.test-vnext-postgres-store]
workspace = false
command = "python3"
args = [
	"scripts/vnext/postgres_store_test.py",
]

[tasks.test-vnext-storage-proof]
workspace = false
command = "python3"
args = [
	"spikes/vnext-storage/proof.py",
]
