# Decodex vNext global configuration.
#
# Install as ~/.decodex/config.toml with mode 0600. Decodex creates its root and
# owned directories with mode 0700. Shared ~/.codex remains Codex-owned and must
# not contain any Decodex vNext configuration, logs, blobs, cache, or identity.
active_profile = "local"
version        = 1

# The API-only CLI uses the active profile unless `--profile NAME` is supplied:
#   decodex status
#   decodex doctor --output json
#   decodex account list
#   decodex account profile --account-id 10000000-0000-4000-8000-000000000001
#   decodex reset-card list --account 10000000-0000-4000-8000-000000000001
# It verifies the negotiated V1.5 contract and stable server identity before it accepts
# daemon results. `--root PATH` selects another typed Decodex root for isolated
# operation or tests. Use `--profile NAME --expected-server-id UUID` to retain an
# explicitly pinned authority. Reset-card operations currently reject remote profiles
# until authenticated remote transport exists.

# Local means the client and decodexd share one owner effective UID on one host.
# The fixed endpoint is ~/.decodex/server/decodex.sock. Replace 501 with the
# exact output of `id -u` for the account that owns this Decodex root.
[profiles.local]
kind              = "local"
policy            = "same_uid"
service_owner_uid = 501
# Optional pin after this host has created ~/.decodex/server/identity.
# expected_server_identity = "018f0f9e-7b6e-4a31-8f4c-1d2e3f405162"

# Remote is an explicit data model for a different server host. It contains no
# repository path and always requires a stable server-identity pin. This profile
# does not enable a remote listener, authentication, or TLS; those remain
# gated future work.
[profiles.remote]
expected_server_identity = "018f0f9e-7b6e-4a31-8f4c-1d2e3f405162"
host                     = "decodex-server.example.test"
kind                     = "remote"
port                     = 49152

# Explicit PostgreSQL endpoint data for the server host. Normal decodexd serve resolves only
# the least-privilege runtime identity, executes no DDL, and verifies the exact latest catalog
# and authority. The schema-owner identity is supplied only to the explicit empty-target
# `bootstrap-latest-schema` operator command and is never stored here. Store no password here:
# only the named runtime environment variable is resolved at daemon bootstrap, and its value is
# never reported. Pin the PostgreSQL server's host UID explicitly; socket ownership is evidence,
# never its own trust root.
# Use a dedicated directory owned by that UID with no group/other write bits; a conventional shared
# PostgreSQL socket directory is unsuitable when it is group- or world-writable.
[postgres]
database          = "decodex"
expected_peer_uid = 70                                    # `id -u postgres` on this server host; do not infer from the socket.
port              = 5432
socket_directory  = "/absolute/private/postgresql-socket"

[postgres.runtime]
credential_env_var = "DECODEX_POSTGRES_RUNTIME_PASSWORD"
user               = "decodex_runtime"

# Disposable cache limits. Cache bytes are never authoritative and may be deleted
# and rebuilt. Hard ceilings are 10,000 entries, 512 MiB total, and 16 MiB per entry.
[cache]
max_bytes       = 134217728
max_entries     = 2048
max_entry_bytes = 4194304
