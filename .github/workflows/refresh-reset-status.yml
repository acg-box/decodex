name: Refresh Reset Status

permissions:
  contents: write

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh community reset-status artifact
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build reset-status artifact
        run: |
          python3 tools/status/build_reset_status.py \
            --out site/src/content/reset-status/community-codex-reset.json

      - name: Validate reset-status artifact
        run: python3 tools/status/validate_reset_status.py site/src/content/reset-status

      - name: Detect artifact changes
        id: changes
        run: |
          if git diff --quiet -- site/src/content/reset-status/community-codex-reset.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: site
        run: npm ci

      - name: Build site
        if: steps.changes.outputs.changed == 'true'
        working-directory: site
        run: npm run build

      - name: Check site
        if: steps.changes.outputs.changed == 'true'
        working-directory: site
        run: npm run check

      - name: Commit updated reset-status artifact
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/content/reset-status/community-codex-reset.json
          git commit -m "chore(decodex): refresh community reset status"
          git push origin HEAD:main
