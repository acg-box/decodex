name: Release

permissions:
  contents: write

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always
  CLI_BINARY_NAME: decodex
  LINUX_CLI_ASSET: decodex-x86_64-unknown-linux-gnu.tar.gz
  MACOS_APP_ASSET: decodex-app-aarch64-apple-darwin.zip
  MACOS_CLI_ASSET: decodex-aarch64-apple-darwin.zip

  RUST_BACKTRACE: full

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-macos:
    name: Build macOS release packages
    runs-on: macos-26
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Verify release tag and runner
        run: |
          set -euo pipefail

          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo workspace version ${VERSION}" >&2
            exit 1
          fi

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS release assets are named for aarch64; expected an arm64 runner." >&2
            exit 1
          fi

          sw_vers
          swift --version
          xcodebuild -version

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: true

      - name: Build and pack CLI (macOS)
        run: |
          set -euo pipefail

          rustup target add aarch64-apple-darwin
          cargo build \
            --profile final-release \
            --locked \
            --package "${CLI_BINARY_NAME}" \
            --target aarch64-apple-darwin

          cp "target/aarch64-apple-darwin/final-release/${CLI_BINARY_NAME}" .
          zip "${MACOS_CLI_ASSET}" "${CLI_BINARY_NAME}"

      - name: Bundle, sign, optionally notarize, and pack Decodex App
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          for required_secret in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!required_secret:-}" ]]; then
              echo "Missing required secret: ${required_secret}" >&2
              exit 1
            fi
          done

          NOTARY_ENABLED=0
          if [[ -n "${APPLE_NOTARY_KEY_ID:-}" && -n "${APPLE_NOTARY_KEY_P8:-}" ]]; then
            NOTARY_ENABLED=1
          else
            echo "::warning::Apple notary credentials are incomplete; publishing a signed but unnotarized Decodex App zip."
          fi

          CERT_PATH="${RUNNER_TEMP}/apple-cert.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          NOTARY_KEY_PATH=""
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          cleanup_release_secrets() {
            security delete-keychain "${KEYCHAIN_PATH}" >/dev/null 2>&1 || true
            rm -f "${CERT_PATH}" "${NOTARY_KEY_PATH}"
          }
          trap cleanup_release_secrets EXIT

          CERT_PATH="${CERT_PATH}" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"])
          )
          PY

          if [[ "${NOTARY_ENABLED}" == "1" ]]; then
            NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
            printf '%s' "${APPLE_NOTARY_KEY_P8}" > "${NOTARY_KEY_PATH}"
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          IDENTITY_COUNT="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk '/valid identities found/{print $1}')"
          if [[ "${IDENTITY_COUNT:-0}" -lt 1 ]]; then
            echo "No valid code signing identity was imported into the release keychain." >&2
            exit 1
          fi

          DECODEX_APP_CARGO_LOCKED=1 \
          DECODEX_APP_RUST_PROFILE=final-release \
          DECODEX_APP_SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY}" \
          DECODEX_APP_SWIFT_CONFIGURATION=release \
          ./apps/decodex-app/script/build_and_run.sh stage

          COMMON_ROOT="$(cd "$(git rev-parse --git-common-dir)/.." && pwd)"
          APP_PATH="${COMMON_ROOT}/target/decodex-app/Decodex.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Failed to find staged Decodex App bundle at ${APP_PATH}" >&2
            exit 1
          fi
          test "$(plutil -extract CFBundleName raw "${APP_PATH}/Contents/Info.plist")" = "Decodex"
          test "$(plutil -extract CFBundleDisplayName raw "${APP_PATH}/Contents/Info.plist")" = "Decodex"
          test "$(plutil -extract CFBundleIdentifier raw "${APP_PATH}/Contents/Info.plist")" = "space.decodex.app"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign -dv --verbose=4 "${APP_PATH}" 2>&1 | grep -q '^TeamIdentifier='
          codesign -dv --verbose=4 "${APP_PATH}" 2>&1 | grep -q 'flags=.*runtime'

          if [[ "${NOTARY_ENABLED}" == "1" ]]; then
            NOTARY_ZIP="${RUNNER_TEMP}/Decodex-App-notary.zip"
            ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${NOTARY_ZIP}"

            NOTARY_ARGS=(
              submit
              "${NOTARY_ZIP}"
              --wait
              --timeout 30m
              --key "${NOTARY_KEY_PATH}"
              --key-id "${APPLE_NOTARY_KEY_ID}"
            )
            if [[ -n "${APPLE_NOTARY_ISSUER:-}" ]]; then
              NOTARY_ARGS+=(--issuer "${APPLE_NOTARY_ISSUER}")
            fi
            xcrun notarytool "${NOTARY_ARGS[@]}"

            xcrun stapler staple "${APP_PATH}"
            spctl -a -vvv --type exec "${APP_PATH}"
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "${APP_PATH}" \
            "${MACOS_APP_ASSET}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decodex-aarch64-apple-darwin
          path: |
            ${{ env.MACOS_APP_ASSET }}
            ${{ env.MACOS_CLI_ASSET }}
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux CLI package
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Verify release tag
        run: |
          set -euo pipefail

          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo workspace version ${VERSION}" >&2
            exit 1
          fi

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: true

      - name: Build and pack CLI (Linux)
        run: |
          set -euo pipefail

          rustup target add x86_64-unknown-linux-gnu
          cargo build \
            --profile final-release \
            --locked \
            --package "${CLI_BINARY_NAME}" \
            --target x86_64-unknown-linux-gnu

          cp "target/x86_64-unknown-linux-gnu/final-release/${CLI_BINARY_NAME}" .
          tar -czvf "${LINUX_CLI_ASSET}" "${CLI_BINARY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decodex-x86_64-unknown-linux-gnu
          path: ${{ env.LINUX_CLI_ASSET }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Collect artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts
          find . -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec mv {} artifacts/ \;
          test -f "artifacts/${MACOS_APP_ASSET}"
          test -f "artifacts/${MACOS_CLI_ASSET}"
          test -f "artifacts/${LINUX_CLI_ASSET}"
          ls -la artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          required_assets=(
            "${MACOS_APP_ASSET}"
            "${MACOS_CLI_ASSET}"
            "${LINUX_CLI_ASSET}"
          )

          for asset in "${required_assets[@]}"; do
            test -f "artifacts/${asset}"
          done

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mapfile -t published_assets < <(
              gh release view "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '.assets[].name'
            )

            for asset in "${required_assets[@]}"; do
              if ! printf '%s\n' "${published_assets[@]}" | grep -Fxq "${asset}"; then
                echo "Release ${GITHUB_REF_NAME} already exists but is missing ${asset}." >&2
                exit 1
              fi
            done

            echo "Release ${GITHUB_REF_NAME} already exists with all expected assets."
            exit 0
          fi

          gh release create "${GITHUB_REF_NAME}" \
            artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"

  publish-on-crates-io:
    name: Publish on crates.io
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: true
          components: rustfmt, clippy

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Missing required secret: CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi

          cargo publish --locked --package "${CLI_BINARY_NAME}"
